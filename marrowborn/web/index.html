<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><style>body{margin:0}[hidden]{display:none!important}*{-webkit-tap-highlight-color:transparent}</style>
<title>Marrowborn</title>

<style>
@font-face{font-family: 'Pirata One'; font-style: normal; font-weight: 400; font-display: swap; src: url(fonts/f0.woff2) format('woff2');}
@font-face{font-family: 'Spectral'; font-style: italic; font-weight: 400; font-display: swap; src: url(fonts/f1.woff2) format('woff2');}
@font-face{font-family: 'Spectral'; font-style: normal; font-weight: 400; font-display: swap; src: url(fonts/f2.woff2) format('woff2');}
@font-face{font-family: 'Spectral'; font-style: normal; font-weight: 600; font-display: swap; src: url(fonts/f3.woff2) format('woff2');}
</style>
<style>
/* Layout: one crypt-dark column. Header (name + body-part ledger), the arena, a vitals row, touch controls. */
:root{
  color-scheme:dark;
  --ink:#0d0c11; --stone:#1a1822; --stone-2:#2a2636;
  --bone:#e7dfcd; --ash:#958ea3; --blood:#b8263d; --marrow:#d6a544; --flesh:#c68863;
  --pet-necro:#7fd66b; --pet-beast:#8fd3ff; --warn:#ff8497;
  --display:"Pirata One","Luminari","Palatino Linotype",Georgia,serif;
  --body:"Spectral",Georgia,"Times New Roman",serif;
}
html,body{background:var(--ink);color:var(--bone);font-family:var(--body);font-size:16px;line-height:1.45}
.wrap{max-width:1000px;margin:0 auto;padding-block:16px 28px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:12px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 20px}
h1{font-family:var(--display);font-weight:400;font-size:2.1rem;line-height:1;margin:0;letter-spacing:.02em}
#lvl{color:var(--ash);font-style:italic;margin:0}
.ledger{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0}
.ledger li{font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;padding:3px 9px;border:1px solid var(--stone-2);color:var(--ash);opacity:.55}
.ledger li.on{color:var(--ink);background:var(--bone);border-color:var(--bone);opacity:1}
.stage{display:grid;border:1px solid var(--stone-2);background:#000}
canvas{grid-area:1/1;display:block;width:100%;max-width:100%;aspect-ratio:960/600;touch-action:none;align-self:start;cursor:crosshair}
#cv{position:relative;z-index:0}
#ov{grid-area:1/1;z-index:1;display:grid;place-items:center;padding:16px;background:rgba(13,12,17,.62)}
#ov.soft{background:rgba(13,12,17,.3);place-items:start center}
.panel{max-width:520px;min-width:0;text-align:center;background:rgba(13,12,17,.88);border:1px solid var(--stone-2);padding:20px 22px;display:flex;flex-direction:column;gap:10px;align-items:center}
.panel .kick{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--marrow);margin:0}
.panel h2{font-family:var(--display);font-weight:400;font-size:2.4rem;line-height:1;margin:0;text-wrap:balance}
.panel p{margin:0;text-wrap:pretty}
.panel .keys{color:var(--ash);font-size:.9rem}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:4px}
button{font:inherit;color:var(--bone);background:var(--stone);border:1px solid var(--ash);padding:8px 18px;cursor:pointer}
button.primary{background:var(--blood);border-color:var(--blood);font-weight:600}
button:hover{filter:brightness(1.15)}
button:focus-visible{outline:2px solid var(--marrow);outline-offset:2px}
button:disabled{opacity:.35;cursor:default}
.vitals{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;justify-content:space-between}
.vitals>div{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;min-width:0}
.lab{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ash)}
#hp{display:flex;flex-wrap:wrap;gap:4px;align-items:center;min-width:0}
#hp.many{gap:2px 1px}#hp.many i{width:5px}#hp.lots i{width:3px}
#hp i{width:11px;height:15px;background:var(--blood);display:block}
#hp i.off{background:var(--stone-2)}
#hp em{color:var(--ash);font-size:.92rem}
#bossBar{width:min(260px,40vw);height:10px;background:var(--stone-2)}
#bossFill{height:100%;width:100%;background:var(--marrow)}
.tog{padding:3px 10px;font-size:.85rem}
.tog[aria-pressed="false"]{opacity:.45;text-decoration:line-through}
.panel.wide{max-width:760px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;width:100%}
.cards button{display:flex;flex-direction:column;gap:5px;text-align:left;align-items:flex-start;padding:10px 12px;min-width:0}
.cards b{font-family:var(--display);font-weight:400;font-size:1.6rem;line-height:1}
.cards small{color:var(--marrow);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase}
.cards span{font-size:.86rem;line-height:1.3}
.touch{display:none;justify-content:space-between;align-items:center;gap:16px;user-select:none;-webkit-user-select:none}
@media (pointer:coarse){.touch{display:flex}.kbd{display:none}}
#pad{width:120px;height:120px;border-radius:50%;border:1px solid var(--ash);background:var(--stone);position:relative;touch-action:none;flex:none}
#knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border-radius:50%;background:var(--bone);opacity:.85}
/* Strike, Dash and six skills: a 3 x 3 grid. Skills fill two columns from the bottom up, so the first ones sit nearest the thumb; Dash sits above a tall Strike on the outside.
   --s skill cell, --a Strike column, --g gap; all scale with the button-size setting (--mb-btn). */
.touch .acts{--s:calc(60px*var(--mb-btn,1));--a:calc(80px*var(--mb-btn,1));--g:calc(8px*var(--mb-btn,1));
  display:grid;grid-template-columns:var(--s) var(--s) var(--a);grid-template-rows:repeat(3,var(--s));gap:var(--g);grid-template-areas:"s5 s6 dash" "s3 s4 atk" "s1 s2 atk";flex:none;margin-left:auto}
.touch .acts button{min-width:0;padding:2px;touch-action:none;font-size:calc(1rem*var(--mb-btn,1))}
.touch .acts button.sk{font-size:calc(.66rem*var(--mb-btn,1))}
#bSkill{grid-area:s1}#bSkill2{grid-area:s2}#bSkill3{grid-area:s3}#bSkill4{grid-area:s4}#bSkill5{grid-area:s5}#bSkill6{grid-area:s6}
#bDash{grid-area:dash;border-radius:calc(30px*var(--mb-btn,1))}#bAtk{grid-area:atk;border-radius:calc(40px*var(--mb-btn,1))}
@media (max-width:420px){.touch{flex-wrap:wrap;gap:12px}.touch .acts{--s:calc(54px*var(--mb-btn,1));--a:calc(72px*var(--mb-btn,1));--g:calc(6px*var(--mb-btn,1))}}
#petHud{display:flex;align-items:center;gap:8px;min-width:0}
#petName{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px;color:var(--pet-necro)}
#petBar{display:block;width:56px;height:6px;background:var(--stone-2);flex:none}
#petFill{display:block;height:100%;width:100%;background:var(--pet-necro)}
#petHud.beast #petName{color:var(--pet-beast)}#petHud.beast #petFill{background:var(--pet-beast)}
#petHud.down #petName{color:var(--ash)}
.kbd{color:var(--ash);font-size:.9rem;margin:0}
kbd{font-family:inherit;border:1px solid var(--stone-2);padding:0 6px;color:var(--bone)}

/* phone held sideways: the arena fills the screen, controls float over its edges */
@media (orientation:landscape) and (pointer:coarse) and (max-height:600px){
  html,body{height:100%;overflow:hidden}
  .wrap{max-width:none;height:100%;padding:0;display:block}
  header,.ledger,.kbd{display:none}
  .stage{border:0;height:100%;justify-items:center;grid-template-rows:minmax(0,1fr);grid-template-columns:minmax(0,1fr)}
  canvas{width:auto;height:100%;max-width:100%;align-self:center}
  #ov{width:100%;height:100%;overflow:auto;padding:8px;box-sizing:border-box}
  #ov.soft{place-items:center}
  .panel{padding:12px 18px;gap:6px;max-width:600px}.panel h2{font-size:1.9rem}.panel p{font-size:.92rem;line-height:1.35}
  .vitals{position:fixed;z-index:2;top:max(6px,env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));pointer-events:none;font-size:.8rem;text-shadow:0 1px 2px #000}
  .vitals button{pointer-events:auto}#hp em{max-width:38vw;font-size:.72rem;line-height:1.2}#bossBar{width:22vw}
  .touch{position:fixed;z-index:2;bottom:max(14px,env(safe-area-inset-bottom,0px));left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));pointer-events:none}
  #pad,.touch .acts{pointer-events:auto}#pad{opacity:.62}
  /* the buttons float over the edge of the arena: see-through until pressed, so what stands under them still shows */
  .touch .acts button{opacity:.5;text-shadow:0 1px 2px #000;transition:opacity .08s}
  .touch .acts button.dn,.touch .acts button:active{opacity:1}
  /* sideways the grid is two columns hugging the screen edge, on the black bar beside the arena: three rows of skills over Dash and Strike. Rows stop growing when four of them fill the screen height. */
  .touch{align-items:flex-end;flex-wrap:nowrap}
  .touch .acts{--s:calc(56px*var(--mb-btn,1));--g:calc(6px*var(--mb-btn,1));--h:min(var(--s),calc((100vh - 76px)/4.5));
    grid-template-columns:var(--s) var(--s);grid-template-rows:var(--h) var(--h) var(--h) calc(var(--h)*1.3);grid-template-areas:"s5 s6" "s3 s4" "s1 s2" "dash atk"}
  .touch .acts button.sk{font-size:calc(.6rem*var(--mb-btn,1))}
  .mb-left .wrap .touch .acts{grid-template-columns:var(--s) var(--s);grid-template-areas:"s6 s5" "s4 s3" "s2 s1" "atk dash"}
  #bDash,#bAtk{border-radius:calc(22px*var(--mb-btn,1))}
  #petName{max-width:120px}#petBar{width:40px}
  .cards button{padding:7px 10px;gap:3px}.cards span{font-size:.8rem}.cards b{font-size:1.35rem}
}
/* ---- touch layout options (settings): --mb-btn scales the stick and buttons, .mb-left mirrors them ---- */
:root{--mb-btn:1}
.wrap #pad{width:calc(120px*max(1,var(--mb-btn)));height:calc(120px*max(1,var(--mb-btn)))}
.mb-left .touch{flex-direction:row-reverse}
.mb-left .touch .acts{grid-template-columns:var(--a) var(--s) var(--s);grid-template-areas:"dash s6 s5" "atk s4 s3" "atk s2 s1";margin-left:0;margin-right:auto}

/* ---- extras.js: settings, records and story layer over the arena; hint toast ---- */
#mbx{grid-area:1/1;position:relative;z-index:3;display:grid;place-items:center;padding:16px;box-sizing:border-box;min-width:0;min-height:0;overflow:auto;background:var(--ink)}
#mbx.mbx-veil{background:rgba(13,12,17,.9)}
.mbx-panel{box-sizing:border-box;width:100%;max-width:680px;min-width:0;display:flex;flex-direction:column;gap:12px;align-items:stretch;border:1px solid var(--stone-2);background:var(--ink);padding:18px 22px;outline:0}
.mbx-panel .kick{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--marrow);margin:0;text-align:center}
.mbx-panel h2{font-family:var(--display);font-weight:400;font-size:2.1rem;line-height:1;margin:0;text-align:center;text-wrap:balance}
.mbx-panel p{margin:0;text-wrap:pretty}
.mbx-panel .dim{color:var(--ash);font-size:.9rem}
.mbx-panel .btns{margin-top:2px}
.mbx-panel .btns button{min-height:40px}
.mbx-rows{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(270px,100%),1fr));gap:4px 28px}
.mbx-row{display:grid;grid-template-columns:116px minmax(0,1fr);align-items:center;gap:12px;min-height:44px;border:0;margin:0;padding:0;min-width:0}
.mbx-row>.lab,.mbx-row>legend{padding:0;float:left;white-space:nowrap}
.mbx-row .val{color:var(--ash);font-size:.85rem;font-variant-numeric:tabular-nums;min-width:3.2em;text-align:right}
.mbx-ctl{display:flex;align-items:center;gap:10px;min-width:0}
.mbx-ctl input[type=range]{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:40px;margin:0;background:transparent;cursor:pointer;accent-color:var(--marrow)}
.mbx-ctl input[type=range]::-webkit-slider-runnable-track{height:6px;background:linear-gradient(to right,var(--marrow) var(--fill,50%),var(--stone-2) 0);border:0}
.mbx-ctl input[type=range]::-moz-range-track{height:6px;background:var(--stone-2);border:0}
.mbx-ctl input[type=range]::-moz-range-progress{height:6px;background:var(--marrow)}
.mbx-ctl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:26px;margin-top:-10px;background:var(--bone);border:1px solid var(--ink);border-radius:0}
.mbx-ctl input[type=range]::-moz-range-thumb{width:18px;height:26px;background:var(--bone);border:1px solid var(--ink);border-radius:0}
.mbx-ctl input[type=range]:focus-visible{outline:2px solid var(--marrow);outline-offset:2px}
.mbx-seg{display:flex;flex:1;min-width:0}
.mbx-seg label{flex:1;position:relative;display:block;min-width:0}
.mbx-seg input,.mbx-sw input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.mbx-seg span{display:block;text-align:center;padding:7px 6px;border:1px solid var(--ash);background:var(--stone);margin-left:-1px;color:var(--bone)}
.mbx-seg label:first-child span{margin-left:0}
.mbx-seg input:checked+span{background:var(--bone);color:var(--ink);border-color:var(--bone);font-weight:600}
.mbx-seg input:focus-visible+span,.mbx-sw input:focus-visible+span{outline:2px solid var(--marrow);outline-offset:2px;position:relative;z-index:1}
.mbx-sw{position:relative;display:inline-flex;align-items:center;gap:10px;min-height:40px;cursor:pointer}
.mbx-sw span{display:block;width:52px;height:26px;border:1px solid var(--ash);background:var(--stone);position:relative;flex:none}
.mbx-sw span::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:18px;background:var(--ash);transition:transform .12s}
.mbx-sw input:checked+span{border-color:var(--marrow)}
.mbx-sw input:checked+span::after{transform:translateX(24px);background:var(--marrow)}
.mbx-sw em{font-style:normal;color:var(--ash);font-size:.85rem}
.mbx-panel textarea{font:14px/1.35 ui-monospace,Menlo,Consolas,monospace;color:var(--bone);background:var(--stone);border:1px solid var(--ash);padding:8px 10px;width:100%;box-sizing:border-box;min-height:92px;resize:none;border-radius:0;word-break:break-all;user-select:text;-webkit-user-select:text}
.mbx-panel textarea:focus-visible{outline:2px solid var(--marrow);outline-offset:2px}
.mbx-msg{min-height:1.4em;font-size:.92rem;color:var(--ash);text-align:center}
.mbx-msg.bad{color:#ff8497}.mbx-msg.good{color:var(--marrow)}
.mbx-wide{max-width:780px}
.mbx-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
.mbx-tiles div{border:1px solid var(--stone-2);padding:7px 10px;min-width:0}
.mbx-tiles b{display:block;font-family:var(--display);font-weight:400;font-size:1.7rem;line-height:1.05}
.mbx-tiles small,.mbx-rec h3{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ash);font-weight:400;margin:0}
.mbx-rec{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(290px,100%),1fr));gap:12px 26px;align-items:start}
.mbx-rec h3{color:var(--marrow);margin-bottom:4px}
.mbx-rec table{border-collapse:collapse;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums}
.mbx-rec th,.mbx-rec td{text-align:right;padding:3px 0 3px 10px;border-bottom:1px solid var(--stone-2);font-weight:400}
.mbx-rec th:first-child,.mbx-rec td:first-child{text-align:left;padding-left:0}
.mbx-rec thead th{color:var(--ash);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase}
.mbx-rec ol{list-style:none;margin:0;padding:0;font-size:.9rem}
.mbx-rec ol li{display:flex;justify-content:space-between;gap:12px;padding:3px 0;border-bottom:1px solid var(--stone-2)}
.mbx-rec ol li span:last-child{color:var(--marrow);font-variant-numeric:tabular-nums;white-space:nowrap}
.mbx-story{max-width:560px;text-align:center;gap:14px;padding:26px 30px;cursor:pointer;animation:mbxIn .5s ease-out}
.mbx-story .tale{font-size:1.12rem;line-height:1.55;font-style:italic}
@keyframes mbxIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#mbHint{grid-area:1/1;position:relative;z-index:2;align-self:start;justify-self:center;margin:12px 12px 0;max-width:min(430px,calc(100% - 24px));box-sizing:border-box;pointer-events:none;
  background:rgba(13,12,17,.9);border:1px solid var(--marrow);border-left-width:4px;padding:7px 14px;font-size:.95rem;line-height:1.35;text-align:left;opacity:0;transform:translateY(-6px);transition:opacity .35s,transform .35s}
#mbHint.on{opacity:1;transform:none}
#mbHint b{display:block;font-weight:400;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--marrow)}
.panel .mbx-note{color:var(--ash);font-size:.9rem;border-top:1px solid var(--stone-2);padding-top:8px;align-self:stretch}
.panel .mbx-note b{color:var(--marrow);font-weight:600}
@media (prefers-reduced-motion:reduce){.mbx-story{animation:none}#mbHint{transition:none}}
@media (max-width:480px){
  #mbx{padding:8px}.mbx-panel{padding:14px 12px}.mbx-story{padding:18px 14px}.mbx-row{grid-template-columns:104px minmax(0,1fr);gap:8px}.mbx-row .val{min-width:2.6em}
  #mbHint{margin:6px 6px 0;padding:5px 10px;font-size:.8rem;max-width:calc(100% - 12px)}
}
@media (orientation:landscape) and (pointer:coarse) and (max-height:600px){
  #mbx,#mbx.mbx-veil{padding:8px;width:100%;height:100%;background:var(--ink)}
  /* a screen is up (title, reward, pause, settings, story): the floating vitals, stick and buttons would only cover it */
  .stage:has(#ov:not([hidden]))~.touch,.stage:has(#mbx:not([hidden]))~.touch,.stage:has(#ov:not([hidden]))~.vitals,.stage:has(#mbx:not([hidden]))~.vitals{visibility:hidden}
  .mbx-panel{padding:10px 18px;gap:6px}.mbx-panel h2{font-size:1.6rem}.mbx-panel p{font-size:.92rem;line-height:1.35}
  .mbx-row{min-height:40px}.mbx-rows{gap:0 24px}
  .mbx-panel textarea{min-height:64px;font-size:12px}
  .mbx-story{padding:14px 22px;gap:8px}.mbx-story .tale{font-size:1rem;line-height:1.45}
  .mbx-tiles b{font-size:1.35rem}.mbx-tiles div{padding:4px 8px}.mbx-rec table,.mbx-rec ol{font-size:.82rem}
  #mbHint{margin-top:40px;font-size:.85rem;max-width:min(360px,calc(100% - 24px))}
}
</style>

<main class="wrap">
  <header>
    <h1>Marrowborn</h1>
    <p id="lvl">A crypt. A pile of bones.</p>
  </header>
  <ul class="ledger" id="ledger" aria-label="Body parts recovered"></ul>
  <div class="stage">
    <canvas id="gl" hidden aria-hidden="true"></canvas>
    <canvas id="cv" aria-label="Game arena"></canvas>
    <div id="ov"><div class="panel" id="ovPanel">
      <p class="kick" id="ovKick"></p>
      <h2 id="ovTitle"></h2>
      <p id="ovBody"></p>
      <p class="keys" id="ovKeys"></p>
      <div class="cards" id="ovCards"></div>
      <div class="btns" id="ovBtns"></div>
    </div></div>
  </div>
  <div class="vitals">
    <div><span class="lab">You</span><span id="hp"></span></div>
    <div><span class="lab" id="bossName">—</span><div id="bossBar"><div id="bossFill"></div></div>
      <button id="snd" class="tog" type="button" aria-pressed="true">Sound</button><button id="hap" class="tog" type="button" aria-pressed="true">Haptics</button></div>
  </div>
  <div class="touch">
    <div id="pad"><div id="knob"></div></div>
    <div class="acts"><button id="bDash" type="button">Dash</button><button id="bAtk" type="button" class="primary">Strike</button><button id="bSkill" type="button" hidden>Skill</button></div>
  </div>
  <p class="kbd"><kbd>WASD</kbd> or arrows to move · <kbd>Space</kbd> or click to strike · <kbd>Shift</kbd> to dash, once you have lungs · <kbd>1</kbd> to <kbd>6</kbd> for class skills · <kbd>Esc</kbd> to pause</p>
</main>

<script src="vendor/three.min.js"></script>
<script src="game.js"></script>
<script src="models-player.js"></script>
<script src="models-monsters.js"></script>
<script src="render3d.js"></script>
<script src="extras.js"></script>


</html>
