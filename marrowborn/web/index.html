<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><style>body{margin:0}[hidden]{display:none!important}*{-webkit-tap-highlight-color:transparent}</style>
<title>Ashes to Apex</title>

<meta name="theme-color" content="#070912">
<!-- installable from a browser (Add to Home Screen on iOS, Install in Chrome and Edge); harmless inside the app -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ashes to Apex">
<meta name="format-detection" content="telephone=no">
<style>
/* Fonts: Rajdhani (display, labels, numbers) and Barlow (text). Both SIL Open Font License 1.1, latin subset, bundled for offline use. */
@font-face{font-family:'Rajdhani';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/rajdhani-500.woff2) format('woff2')}
@font-face{font-family:'Rajdhani';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/rajdhani-600.woff2) format('woff2')}
@font-face{font-family:'Rajdhani';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/rajdhani-700.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/barlow-400.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-600.woff2) format('woff2')}

/* ================= tokens =================
   Names used by game.js and extras.js (--ink --stone --stone-2 --bone --ash --blood --marrow --flesh --pet-necro --pet-beast --warn
   --display --body --mb-btn --cd --fill) are kept; only their values changed. Accents match MBStyle in render3d.js:
   power = electric violet (the player), power2 = cyan-white (highlights), foe = crimson (danger), gold = rarity and rank only. */
:root{
  color-scheme:dark;
  --ink:#070912; --stone:#10142a; --stone-2:#272e4d;
  --bone:#eeecfb; --ash:#989bbd; --blood:#f0355a; --marrow:#f0b848; --flesh:#c68863;
  --pet-necro:#7fd66b; --pet-beast:#8fd3ff; --warn:#ff8497;
  --power:#8b4dff; --power-hi:#b89cff; --power2:#c4f4ff; --foe:#ff2d55; --gold:#f0b848;
  --mana:#5cd9ff; --mana2:#8f6bff;
  --trial:#ff9950; --apex-dom:#c77dff; --apex-ord:#ffe7a3;
  --text:#d3d6ea; --line:#313a63; --plate:rgba(16,20,42,.92); --panel:rgba(9,11,24,.94);
  --r-common:#b9b2c6; --r-rare:#6ea3e0; --r-epic:#b88cff; --r-legendary:#f0b848;
  --display:"Rajdhani","Oswald","Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif;
  --body:"Barlow","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mb-btn:1;
}
*{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
html{background:var(--ink);-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
body{background:radial-gradient(1100px 420px at 50% -120px,rgba(139,77,255,.13),transparent 70%),var(--ink);color:var(--bone);font-family:var(--body);font-size:16px;line-height:1.45;min-height:100vh}
.wrap{max-width:1000px;margin:0 auto;padding-block:16px 28px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:12px}

/* ---- shape language: plates with two cut corners (top left, bottom right), drawn without borders so the cut edge gets a line too.
   --c cut size, --e edge colour, --f fill. Slanted bands (kick, level line, bars) and bracket corners (panels, arena) complete it. ---- */
button,.ledger li,.mbx-seg span,.mbx-tiles div,.panel,.mbx-panel{
  --c:7px;--e:var(--line);--f:var(--plate);border:0;border-radius:0;
  clip-path:polygon(var(--c) 0,100% 0,100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,0 100%,0 var(--c));
  box-shadow:inset 0 0 0 1px var(--e);
  background:linear-gradient(135deg,var(--e) calc(var(--c)*.7071 + 1px),transparent 0),linear-gradient(315deg,var(--e) calc(var(--c)*.7071 + 1px),transparent 0),var(--f)}

/* ---- header ---- */
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 20px}
h1{font-family:var(--display);font-weight:700;font-size:1.9rem;line-height:1;margin:0;letter-spacing:.16em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
h1::before{content:"";width:9px;height:.82em;background:linear-gradient(var(--power2),var(--power));transform:skewX(-18deg);flex:none}
#lvl{font-family:var(--display);font-weight:500;font-size:1rem;letter-spacing:.12em;text-transform:uppercase;color:var(--text);margin:0;font-variant-numeric:tabular-nums;
  padding:3px 14px 3px 22px;background:linear-gradient(90deg,rgba(139,77,255,.05),rgba(139,77,255,.24));clip-path:polygon(12px 0,100% 0,100% 100%,0 100%);box-shadow:inset -2px 0 0 var(--power)}

/* ---- ledger chips: body parts, then rank, class, powers, boons, pets; equipment chips carry their rarity colour inline ---- */
.ledger{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0}
.ledger li{--c:5px;--f:transparent;font-family:var(--display);font-weight:600;font-size:.8rem;line-height:1.3;letter-spacing:.12em;text-transform:uppercase;padding:3px 11px;color:var(--ash);opacity:.6;font-variant-numeric:tabular-nums}
.ledger li.on{--e:rgba(184,156,255,.75);--f:linear-gradient(100deg,rgba(139,77,255,.42),rgba(139,77,255,.16));color:#f4f0ff;opacity:1}
.ledger li[style]{--e:currentColor;--f:rgba(16,20,42,.75)}
.ledger:has(li[style]) li.on:first-child{--e:var(--gold);--f:linear-gradient(100deg,rgba(240,184,72,.26),rgba(240,184,72,.08));color:var(--gold)}

/* ---- arena frame ---- */
.stage{display:grid;position:relative;border:1px solid var(--line);background:#000;box-shadow:0 0 44px rgba(139,77,255,.11)}
.stage::before,.stage::after{content:"";position:absolute;z-index:4;width:22px;height:22px;pointer-events:none;border:2px solid var(--power2);opacity:.85}
.stage::before{left:-2px;top:-2px;border-right:0;border-bottom:0}
.stage::after{right:-2px;bottom:-2px;border-left:0;border-top:0}
canvas{grid-area:1/1;display:block;width:100%;max-width:100%;aspect-ratio:960/600;touch-action:none;align-self:start;cursor:crosshair}
#cv{position:relative;z-index:0}

/* ---- overlay and its panel (title, reward, drop, pet, loadout, pause, death) ---- */
#ov{grid-area:1/1;z-index:1;display:grid;place-items:center;padding:16px;background:linear-gradient(rgba(7,9,18,.5),rgba(7,9,18,.74))}
#ov.soft{background:rgba(7,9,18,.3);place-items:start center}
.panel,.mbx-panel{--c:18px;--e:var(--line);--sweep:rgba(196,244,255,.13);position:relative;
  background:
    linear-gradient(105deg,transparent 42%,var(--sweep) 50%,transparent 58%) 200% 0/250% 100% no-repeat,
    linear-gradient(135deg,var(--power) calc(var(--c)*.7071 + 2px),transparent 0),linear-gradient(315deg,var(--power) calc(var(--c)*.7071 + 2px),transparent 0),
    linear-gradient(var(--power2),var(--power2)) 100% 0/30px 2px no-repeat,linear-gradient(var(--power2),var(--power2)) 100% 0/2px 30px no-repeat,
    linear-gradient(var(--power2),var(--power2)) 0 100%/30px 2px no-repeat,linear-gradient(var(--power2),var(--power2)) 0 100%/2px 30px no-repeat,
    radial-gradient(120% 90px at 50% 0,rgba(139,77,255,.2),transparent 70%),
    repeating-linear-gradient(0deg,rgba(255,255,255,.016) 0 1px,transparent 1px 3px),
    var(--panel)}
.panel{max-width:520px;min-width:0;box-sizing:border-box;text-align:center;padding:22px 26px;display:flex;flex-direction:column;gap:10px;align-items:center;
  animation:mbIn .2s ease-out both,mbSweep .7s .08s ease-out both}
.panel>*{flex-shrink:0}
.panel.wide{max-width:780px}
/* extras.js marks the first screen after a kill (mbx-clear) and a rank-up (mbx-rankup): one more accent sweep, gold for a new rank */
.panel.mbx-clear{animation-name:mbIn,mbSweepB}
.panel.mbx-rankup{--sweep:rgba(240,184,72,.3);animation-name:mbIn,mbSweepC;animation-duration:.2s,1.1s}
.panel.mbx-rankup #ovKeys{color:var(--gold);font-family:var(--display);font-weight:600;font-size:1rem;letter-spacing:.08em;text-transform:uppercase}
@keyframes mbIn{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
@keyframes mbSweep{from{background-position:200% 0,0 0,0 0,100% 0,100% 0,0 100%,0 100%,0 0,0 0,0 0}to{background-position:-100% 0,0 0,0 0,100% 0,100% 0,0 100%,0 100%,0 0,0 0,0 0}}
@keyframes mbSweepB{from{background-position:200% 0,0 0,0 0,100% 0,100% 0,0 100%,0 100%,0 0,0 0,0 0}to{background-position:-100% 0,0 0,0 0,100% 0,100% 0,0 100%,0 100%,0 0,0 0,0 0}}
@keyframes mbSweepC{from{background-position:200% 0,0 0,0 0,100% 0,100% 0,0 100%,0 100%,0 0,0 0,0 0}to{background-position:-100% 0,0 0,0 0,100% 0,100% 0,0 100%,0 100%,0 0,0 0,0 0}}
.kick{font-family:var(--display);font-weight:600;font-size:.84rem;line-height:1.25;letter-spacing:.16em;text-transform:uppercase;color:var(--power2);margin:0;font-variant-numeric:tabular-nums;
  padding:4px 20px;background:linear-gradient(90deg,rgba(139,77,255,.14),rgba(139,77,255,.42),rgba(139,77,255,.14));clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);max-width:100%;box-sizing:border-box}
.kick:empty{display:none}
.panel h2,.mbx-panel h2{font-family:var(--display);font-weight:700;font-size:2.3rem;line-height:1;margin:2px 0 0;letter-spacing:.04em;text-transform:uppercase;text-wrap:balance;max-width:100%;overflow-wrap:anywhere}
.panel h2::after,.mbx-panel h2::after{content:"";display:block;width:64px;height:3px;margin:10px auto 2px;background:var(--power);transform:skewX(-30deg)}
.panel h2[style*="color"]::after{background:currentColor}
.panel p{margin:0;text-wrap:pretty;color:var(--text)}
.panel .keys{color:var(--ash);font-size:.9rem}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:6px}

/* ---- buttons ---- */
button{font-family:var(--display);font-weight:600;font-size:1rem;line-height:1.15;letter-spacing:.09em;text-transform:uppercase;color:var(--bone);padding:9px 20px;min-height:40px;cursor:pointer;--e:#4a558c}
button.primary{--e:#c3aaff;--f:linear-gradient(100deg,#5f2bd6,#8b4dff 55%,#a273ff);color:#fff;font-weight:700}
button:hover:not(:disabled){--e:var(--power2);filter:brightness(1.14)}
button:active:not(:disabled){filter:brightness(1.3)}
button:focus-visible{outline:0;--e:var(--power2);box-shadow:inset 0 0 0 2px var(--power2),inset 0 0 16px rgba(196,244,255,.45)}
button:disabled{opacity:.35;cursor:default}
@media (pointer:coarse){button{min-height:44px}}

/* ---- choice cards. The <small> line carries the colour the game gives it (rarity, pet kind, "not carried" grey): its pseudo-elements paint the card's accent bar and wash in that colour ---- */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(166px,1fr));gap:10px;width:100%}
.cards button{--c:11px;--f:rgba(17,22,46,.94);position:relative;display:flex;flex-direction:column;gap:5px;text-align:left;align-items:flex-start;justify-content:flex-start;padding:12px 13px 13px 18px;min-width:0;
  font-family:var(--body);font-weight:400;font-size:1rem;letter-spacing:0;text-transform:none}
.cards b{font-family:var(--display);font-weight:700;font-size:1.3rem;line-height:1;letter-spacing:.03em;text-transform:uppercase;color:var(--bone);overflow-wrap:break-word;max-width:100%}
.cards small{font-family:var(--display);font-weight:600;font-size:.78rem;line-height:1.25;letter-spacing:.12em;text-transform:uppercase;color:var(--power-hi);font-variant-numeric:tabular-nums}
.cards small::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:currentColor}
.cards small::after{content:"";position:absolute;inset:0;background:linear-gradient(125deg,currentColor,transparent 46%);opacity:.11;pointer-events:none}
.cards span{font-size:.88rem;line-height:1.36;color:var(--text)}
.cards button:hover small::after,.cards button:focus-visible small::after{opacity:.22}
/* a long list (the pets screen, .cards.list set by game.js): compact rows in columns that scroll inside the panel; the body text is cut to one line */
.cards.list{grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:6px;max-height:min(44vh,400px);overflow-x:hidden;overflow-y:auto;padding:2px 6px 2px 0;align-content:start;overscroll-behavior:contain}
.cards.list button{--c:8px;padding:7px 10px 8px 15px;gap:2px;min-height:48px}
.cards.list b{font-size:1.04rem}.cards.list small{font-size:.72rem;letter-spacing:.09em}
.cards.list span{font-size:.78rem;line-height:1.25;color:var(--ash);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

/* ---- vitals row: health pips, pets, boss bar, toggles ---- */
.vitals{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:center;justify-content:space-between}
.vitals>div{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;min-width:0}
.vitals>div:last-child{margin-left:auto;justify-content:flex-end}
.lab{font-family:var(--display);font-weight:600;font-size:.84rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ash);font-variant-numeric:tabular-nums}
#hp{display:flex;flex-wrap:wrap;gap:4px 3px;align-items:center;min-width:0;padding:0 3px}
#hp.many{gap:2px 1px}#hp.many i{width:5px}#hp.lots i{width:3px}
#hp i{width:11px;height:15px;background:linear-gradient(#ff5d7c,var(--blood) 55%,#b3123a);display:block;transform:skewX(-16deg)}
#hp i.off{background:var(--stone-2)}
#hp em{color:var(--ash);font-size:.9rem;font-style:normal}
#bossName{color:#ffb3c0}
#bossBar{width:min(260px,40vw);height:10px;background:var(--stone-2);clip-path:polygon(7px 0,100% 0,calc(100% - 7px) 100%,0 100%)}
#bossFill{height:100%;width:100%;background:linear-gradient(90deg,#a80f38,var(--foe))}
.togs{display:flex;gap:8px;align-items:center;margin-left:auto}
.tog{--c:6px;padding:4px 12px;font-size:.84rem;min-height:32px;color:var(--text)}
.tog[aria-pressed="false"]{opacity:.45;text-decoration:line-through}
#pauseB[aria-pressed="true"]{--e:var(--power2);color:var(--power2)}
@media (pointer:coarse){.tog{min-height:44px;min-width:44px}}

/* ---- mana: a slanted bar under the health pips. #manaFill = what you have (violet to cyan), #manaRes = the part held by pets or familiars (hatched, from the right),
   #manaNum = "84 / 120", #manaHeld = "32 held", #manaTag = "Drawing" while standing still pulls mana in. game.js sets .draw .full .low .held .deny on #mana. ---- */
.vitals>div:first-child{flex:1 1 300px}
.vbrk{flex:0 0 100%;height:0;margin:0}
#mana{display:flex;align-items:center;gap:4px 9px;min-width:0;flex-wrap:wrap}
#mana .manaLab{color:var(--mana)}
#manaBar{position:relative;display:block;width:min(210px,40vw);height:9px;flex:none;background:var(--stone-2);clip-path:polygon(7px 0,100% 0,calc(100% - 7px) 100%,0 100%)}
#manaFill,#manaRes{position:absolute;top:0;bottom:0;display:block}
#manaFill{left:0;width:0;background:linear-gradient(90deg,var(--mana2),var(--mana) 85%,var(--power2))}
#manaRes{right:0;width:0;background:repeating-linear-gradient(-60deg,rgba(143,107,255,.6) 0 3px,rgba(12,15,32,.95) 3px 6px)}
#manaNum{color:var(--mana);letter-spacing:.08em;white-space:nowrap}
#manaHeld{color:var(--power-hi);font-size:.74rem;letter-spacing:.1em;white-space:nowrap}#manaHeld:empty{display:none}
#manaTag{color:var(--power2);font-size:.72rem;letter-spacing:.18em;white-space:nowrap}#manaTag:empty{display:none}
#mana.draw #manaFill{animation:mbDraw .9s ease-in-out infinite}
#mana.draw #manaTag::before{content:"";display:inline-block;width:7px;height:7px;margin-right:6px;background:var(--mana);transform:rotate(45deg);animation:mbDraw .9s ease-in-out infinite}
#mana.low #manaNum{color:var(--warn)}
#mana.deny,.sk.deny,#skillBar li.deny{animation:mbDeny .32s linear}
#mana.deny #manaBar{background:rgba(255,132,151,.5)}
@keyframes mbDraw{50%{filter:brightness(1.55)}}
@keyframes mbDeny{15%{transform:translateX(-4px)}35%{transform:translateX(4px)}55%{transform:translateX(-3px)}75%{transform:translateX(2px)}}
@media (prefers-reduced-motion:reduce){#mana.draw #manaFill,#mana.draw #manaTag::before,#mana.deny,.sk.deny,#skillBar li.deny{animation:none}}

/* the active pets or trophies beside your health. Up to three: #petHud holds a .petRow each (name + bar). More than three (#petHud.many): .petCount ("5/7 pets"), then .petPips with one .pip each
   (its inner b is the health, or a familiar's charge; .pip.down = fallen, data-t = seconds until it rises) and .petMore ("+N") past twelve.
   .beast = tamed, .tro = a trophy (bar = charge, colour set inline), .n1-.n4 = how many are out (n4 = four or more), .down = fallen, .ready = trophy charged */
#petHud{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;min-width:0}
.petRow{display:flex;align-items:center;gap:7px;min-width:0}
.petName{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px;color:var(--pet-necro);letter-spacing:.1em}
#petHud.n3 .petName{max-width:130px}
.petBar{display:block;width:48px;height:6px;background:var(--stone-2);flex:none;transform:skewX(-24deg)}
.petFill{display:block;height:100%;width:100%;background:var(--pet-necro)}
#petHud.beast .petName{color:var(--pet-beast)}#petHud.beast .petFill{background:var(--pet-beast)}
.petRow.down .petName{color:var(--ash)}
.petRow.ready .petBar{box-shadow:0 0 0 1px rgba(255,255,255,.55),0 0 9px rgba(196,244,255,.7)}
.petCount{color:var(--pet-necro);letter-spacing:.1em;white-space:nowrap}#petHud.beast .petCount{color:var(--pet-beast)}#petHud.tro .petCount{color:var(--power-hi)}
.petPips{display:flex;flex-wrap:wrap;gap:3px 4px;align-items:center;padding:0 3px}
.pip{position:relative;display:block;width:9px;height:15px;flex:none;background:var(--stone-2);transform:skewX(-14deg);font-style:normal}
.pip b{position:absolute;left:0;right:0;bottom:0;height:100%;display:block;background:var(--pet-necro)}#petHud.beast .pip b{background:var(--pet-beast)}
.pip.down{background:rgba(255,132,151,.16);box-shadow:inset 0 0 0 1px var(--warn)}
.pip.down::after{content:attr(data-t);position:absolute;inset:0;display:grid;place-items:center;transform:skewX(14deg);font:700 10px/1 var(--display);color:var(--warn);font-variant-numeric:tabular-nums}
.pip.ready{box-shadow:0 0 0 1px rgba(255,255,255,.55),0 0 7px rgba(196,244,255,.7)}
.petMore{color:var(--ash);letter-spacing:.08em}

/* ---- keyboard skill bar (game.js builds it and injects base rules; these outrank them) ---- */
.wrap #skillBar{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}
.wrap #skillBar li{--c:6px;--e:var(--line);--f:rgba(16,20,42,.85);flex:1 1 118px;min-width:0;display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:1px 9px;padding:6px 10px 5px;border:0;
  clip-path:polygon(var(--c) 0,100% 0,100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,0 100%,0 var(--c));box-shadow:inset 0 0 0 1px var(--e);
  font-family:var(--display);font-weight:600;font-size:.84rem;line-height:1.1;letter-spacing:.05em;text-transform:uppercase;color:var(--ash);
  background:linear-gradient(135deg,var(--e) calc(var(--c)*.7071 + 1px),transparent 0),linear-gradient(315deg,var(--e) calc(var(--c)*.7071 + 1px),transparent 0),
    linear-gradient(to right,rgba(139,77,255,.34) calc(var(--cd,0)*100%),transparent 0),var(--f)}
.wrap #skillBar li.ready{--e:var(--power);color:var(--bone)}
.wrap #skillBar li.locked{opacity:.45}
/* not enough mana (game.js sets .nomp): dimmer than ready, with the cost in the mana colour; distinct from cooling down, which shows seconds and a sweep */
.wrap #skillBar li.nomp{--e:#2a6588;color:var(--ash);--f:rgba(10,18,32,.85)}
.wrap #skillBar li.nomp .n{opacity:.6}
.wrap #skillBar li.nomp .c,.wrap #skillBar li.ready .c{color:var(--mana)}
.wrap #skillBar .c,.wrap .sk .c{color:var(--power2);font-weight:700;font-variant-numeric:tabular-nums}
.wrap #skillBar kbd{grid-row:1/3}
.wrap #skillBar .n{grid-column:2;min-width:0;overflow-wrap:anywhere}
.wrap #skillBar .c{grid-column:2;margin:0;font-size:.78rem;letter-spacing:.1em}
.wrap #skillBar li:not(.ready) .c{color:var(--power-hi)}
#skillBar kbd{background:rgba(139,77,255,.2);border-color:transparent;color:var(--power2);min-width:1.1em;text-align:center;font-size:1rem;padding:3px 6px}
@media (pointer:coarse){.wrap #skillBar{display:none}}
.kbd{color:var(--ash);font-size:.88rem;margin:0}
kbd{font-family:var(--display);font-weight:600;font-size:.86em;letter-spacing:.06em;border:1px solid var(--line);background:var(--stone);padding:0 6px;color:var(--bone)}

/* ---- touch controls ---- */
.touch{display:none;justify-content:space-between;align-items:center;gap:16px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
@media (pointer:coarse){.touch{display:flex}.kbd{display:none}}
#pad{width:120px;height:120px;border-radius:50%;border:1px solid rgba(184,156,255,.6);position:relative;touch-action:none;flex:none;box-sizing:border-box;
  background:radial-gradient(circle,transparent 0 31%,rgba(196,244,255,.2) 32% 33%,transparent 34%),radial-gradient(circle,rgba(26,22,58,.9),rgba(8,10,22,.9));
  box-shadow:inset 0 0 0 5px rgba(7,9,18,.7),inset 0 0 0 6px rgba(139,77,255,.45),0 0 16px rgba(139,77,255,.25)}
#knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border-radius:50%;opacity:.92;
  background:radial-gradient(circle at 36% 30%,#fff,var(--power2) 38%,var(--power-hi) 78%,var(--power));box-shadow:0 0 14px rgba(139,77,255,.7)}
/* Strike, Dash and six skills: a 3 x 3 grid. Skills fill two columns from the bottom up, so the first ones sit nearest the thumb; Dash sits above a tall Strike on the outside.
   --s skill cell, --a Strike column, --g gap; all scale with the button-size setting (--mb-btn). */
.touch .acts{--s:calc(60px*var(--mb-btn,1));--a:calc(80px*var(--mb-btn,1));--g:calc(8px*var(--mb-btn,1));
  display:grid;grid-template-columns:var(--s) var(--s) var(--a);grid-template-rows:repeat(3,var(--s));gap:var(--g);grid-template-areas:"s5 s6 dash" "s3 s4 atk" "s1 s2 atk";flex:none;margin-left:auto}
.touch .acts button{min-width:0;min-height:0;padding:2px;touch-action:none;font-size:calc(1.05rem*var(--mb-btn,1));letter-spacing:.06em;--c:calc(12px*var(--mb-btn,1))}
#bSkill{grid-area:s1}#bSkill2{grid-area:s2}#bSkill3{grid-area:s3}#bSkill4{grid-area:s4}#bSkill5{grid-area:s5}#bSkill6{grid-area:s6}
#bDash{grid-area:dash;--e:var(--power2);--f:rgba(14,26,44,.92);color:var(--power2)}
#bAtk{grid-area:atk;--c:calc(16px*var(--mb-btn,1));font-size:calc(1.2rem*var(--mb-btn,1))}
/* a skill button: name over the seconds left; the dark wedge is the cooldown, sweeping away clockwise as --cd falls from 1 to 0 */
.wrap .touch .acts button.sk{--c:calc(9px*var(--mb-btn,1));--e:#3d477a;--f:rgba(14,17,36,.94);border-radius:0;font-size:calc(.74rem*var(--mb-btn,1));font-weight:600;letter-spacing:0;line-height:1.02;text-transform:none;hyphens:auto;-webkit-hyphens:auto;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;overflow:hidden;overflow-wrap:anywhere;color:var(--text);
  background:linear-gradient(135deg,var(--e) calc(var(--c)*.7071 + 1px),transparent 0),linear-gradient(315deg,var(--e) calc(var(--c)*.7071 + 1px),transparent 0),
    conic-gradient(rgba(139,77,255,.3) calc(var(--cd,0)*1turn),transparent 0),var(--f)}
.wrap .touch .acts button.sk:not(:disabled){--e:var(--power);--f:linear-gradient(160deg,rgba(60,32,130,.94),rgba(18,20,46,.94));color:#fff}
.wrap .touch .acts button.sk:disabled{opacity:.8}
/* the cost of a skill sits in the uncut top right corner of its button (data-cost); without the mana for it the button dims (.nomp) and the cost takes the middle */
.wrap .touch .acts button.sk{position:relative}
.wrap .touch .acts button.sk[data-cost]::after{content:attr(data-cost);position:absolute;top:1px;right:4px;font-family:var(--display);font-weight:700;font-size:.82em;line-height:1.1;color:var(--mana);font-variant-numeric:tabular-nums}
.wrap .touch .acts button.sk.nomp::after{display:none}
.wrap .touch .acts button.sk.nomp{--e:#2a6588;--f:rgba(8,16,30,.94);color:#7d86a8}
.wrap .sk.nomp .c{color:var(--mana);font-size:1.25em}.wrap .sk.nomp .c::after{content:" mp";font-size:.6em;letter-spacing:.08em}
.wrap .sk .c{font-size:1.4em;line-height:1;letter-spacing:.02em}.sk .c:empty{display:none}
@media (max-width:420px){.wrap .touch .acts button.sk{font-size:calc(.68rem*var(--mb-btn,1))}.touch{flex-wrap:wrap;gap:12px}.touch .acts{--s:calc(54px*var(--mb-btn,1));--a:calc(72px*var(--mb-btn,1));--g:calc(6px*var(--mb-btn,1))}}

/* phone held sideways: the arena fills the screen, controls float over its edges */

  html,body{height:100%;overflow:hidden}
  body{background:#000;min-height:0}
  .wrap{max-width:none;height:100%;padding:0;display:block}
  header,.ledger,.kbd{display:none}
  .stage{border:0;box-shadow:none;height:100%;justify-items:center;grid-template-rows:minmax(0,1fr);grid-template-columns:minmax(0,1fr)}
  .stage::before,.stage::after{display:none}
  canvas{width:auto;height:100%;max-width:100%;align-self:center}
  #ov{width:100%;height:100%;overflow:auto;padding:8px;box-sizing:border-box}
  #ov.soft{place-items:center}
  .panel{--c:14px;padding:12px 20px;gap:6px;max-width:600px;max-height:100%;overflow-x:hidden;overflow-y:auto}
  .panel.wide{max-width:780px}
  .panel h2{font-size:1.8rem}.panel h2::after{margin-top:6px;height:2px}.panel p{font-size:.92rem;line-height:1.35}
  .kick{font-size:.78rem;padding:3px 18px}
  .vitals{position:fixed;z-index:2;top:max(6px,env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));pointer-events:none;align-items:flex-start;gap:4px 16px;text-shadow:0 1px 2px #000,0 0 6px #000}
  .vitals>div{min-height:24px}
  .lab{font-size:.78rem}
  .vitals button{pointer-events:auto;--f:rgba(9,11,24,.55);--e:rgba(74,85,140,.8);text-shadow:none}#hp em{max-width:38vw;font-size:.74rem;line-height:1.2}#bossBar{width:20vw}
  /* the toggles sit in the top corner on their own; the rest of the row keeps clear of them */
  .vitals{padding-right:204px}.togs{position:fixed;top:max(4px,env(safe-area-inset-top,0px));right:max(8px,env(safe-area-inset-right,0px));gap:6px}
  .mb-left .vitals{padding-right:0;padding-left:204px}.mb-left .togs{right:auto;left:max(8px,env(safe-area-inset-left,0px))}
  .vitals>div:last-child{margin-left:0}
  .tog{font-size:.76rem;padding:4px 9px;min-width:58px}
  .touch{position:fixed;z-index:2;bottom:max(14px,env(safe-area-inset-bottom,0px));left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));pointer-events:none}
  #pad,.touch .acts{pointer-events:auto}#pad{opacity:.62}
  /* the buttons float over the edge of the arena: see-through until pressed, so what stands under them still shows */
  .touch .acts button,.wrap .touch .acts button.sk:disabled{opacity:.5;text-shadow:0 1px 2px #000;transition:opacity .08s}
  .touch .acts button.dn,.touch .acts button:active{opacity:1}
  /* sideways the grid is two columns hugging the screen edge, on the black bar beside the arena: three rows of skills over Dash and Strike. Rows stop growing when four of them fill the screen height. */
  .touch{align-items:flex-end;flex-wrap:nowrap}
  .touch .acts{--s:calc(56px*var(--mb-btn,1));--g:calc(6px*var(--mb-btn,1));--h:min(var(--s),calc((100vh - 76px)/4.5));
    grid-template-columns:var(--s) var(--s);grid-template-rows:var(--h) var(--h) var(--h) calc(var(--h)*1.3);grid-template-areas:"s5 s6" "s3 s4" "s1 s2" "dash atk"}
  .wrap .touch .acts button.sk{font-size:calc(.7rem*var(--mb-btn,1))}
  #bAtk,#bDash{font-size:calc(.95rem*var(--mb-btn,1));--c:calc(11px*var(--mb-btn,1))}
  .mb-left .wrap .touch .acts{grid-template-columns:var(--s) var(--s);grid-template-areas:"s6 s5" "s4 s3" "s2 s1" "atk dash"}
  #petHud{gap:2px 10px}.petName,#petHud.n3 .petName{max-width:96px}#petHud.n2 .petName{max-width:76px}#petHud.n3 .petName{max-width:54px}.petBar{width:32px}
  .vbrk,#mana .manaLab,#manaHeld{display:none}#manaBar{width:84px;height:8px}#manaNum{font-size:.74rem}#manaTag{font-size:.66rem;letter-spacing:.12em}
  .pip{width:7px;height:13px}.petPips{gap:2px 3px}.petCount,.petMore{font-size:.72rem}
  .cards.list{max-height:max(104px,calc(100vh - 250px));grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
  #ovPanel:has(.cards.list) #ovBody{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}#ovPanel:has(.cards.list) .btns button{min-height:40px;padding-block:4px}
  .cards button{padding:8px 10px 9px 15px;gap:3px}.cards span{font-size:.8rem}.cards b{font-size:1.25rem}.cards small{font-size:.72rem}
}
/* ---- touch layout options (settings): --mb-btn scales the stick and buttons, .mb-left mirrors them ---- */
.wrap #pad{width:calc(120px*max(1,var(--mb-btn)));height:calc(120px*max(1,var(--mb-btn)))}
.mb-left .touch{flex-direction:row-reverse}
.mb-left .touch .acts{grid-template-columns:var(--a) var(--s) var(--s);grid-template-areas:"dash s6 s5" "atk s4 s3" "atk s2 s1";margin-left:0;margin-right:auto}

/* ---- extras.js: settings, records and story layer over the arena; hint toast ---- */
#mbx{grid-area:1/1;position:relative;z-index:3;display:grid;place-items:center;padding:16px;box-sizing:border-box;min-width:0;min-height:0;overflow:auto;
  background:radial-gradient(90% 70% at 50% 0,rgba(139,77,255,.14),transparent 70%),var(--ink)}
#mbx.mbx-veil{background:rgba(7,9,18,.9)}
.mbx-panel{box-sizing:border-box;width:100%;max-width:680px;min-width:0;display:flex;flex-direction:column;gap:12px;align-items:stretch;padding:20px 24px;outline:0;animation:mbIn .2s ease-out both}
.mbx-panel .kick{align-self:center;text-align:center}
.mbx-panel h2{font-size:2rem;text-align:center}
.mbx-panel p{margin:0;text-wrap:pretty;color:var(--text)}
.mbx-panel .dim{color:var(--ash);font-size:.9rem}
.mbx-center{text-align:center}
.mbx-panel .btns{margin-top:4px}
.mbx-panel .btns button{min-height:44px}
.mbx-rows{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(270px,100%),1fr));gap:4px 28px}

.mbx-row>.lab,.mbx-row>legend{padding:0;float:left;white-space:nowrap;color:var(--text)}
.mbx-row .val{font-family:var(--display);font-weight:600;color:var(--power2);font-size:.95rem;font-variant-numeric:tabular-nums;min-width:3.2em;text-align:right}
.mbx-ctl{display:flex;align-items:center;gap:10px;min-width:0}
.mbx-ctl input[type=range]{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:44px;margin:0;background:transparent;cursor:pointer;accent-color:var(--power)}
.mbx-ctl input[type=range]::-webkit-slider-runnable-track{height:6px;background:linear-gradient(to right,var(--power) var(--fill,50%),var(--stone-2) 0);border:0}
.mbx-ctl input[type=range]::-moz-range-track{height:6px;background:var(--stone-2);border:0}
.mbx-ctl input[type=range]::-moz-range-progress{height:6px;background:var(--power)}
.mbx-ctl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:26px;margin-top:-10px;background:linear-gradient(var(--bone),var(--power2));border:0;border-radius:0;box-shadow:0 0 10px rgba(139,77,255,.8);transform:skewX(-14deg)}
.mbx-ctl input[type=range]::-moz-range-thumb{width:14px;height:26px;background:var(--power2);border:0;border-radius:0}
.mbx-ctl input[type=range]:focus-visible{outline:2px solid var(--power2);outline-offset:0}
.mbx-seg{display:flex;flex:1;min-width:0;gap:5px}
.mbx-seg label{flex:1;position:relative;display:block;min-width:0}
.mbx-seg input,.mbx-sw input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.mbx-seg span{--c:6px;--e:#4a558c;display:flex;align-items:center;justify-content:center;min-height:44px;box-sizing:border-box;padding:4px 6px;color:var(--text);
  font-family:var(--display);font-weight:600;font-size:.95rem;letter-spacing:.09em;text-transform:uppercase}
.mbx-seg input:checked+span{--e:#c3aaff;--f:linear-gradient(100deg,#5f2bd6,#8b4dff 55%,#a273ff);color:#fff;font-weight:700}
.mbx-seg input:focus-visible+span{--e:var(--power2);box-shadow:inset 0 0 0 2px var(--power2),inset 0 0 14px rgba(196,244,255,.45)}
.mbx-sw{position:relative;display:inline-flex;align-items:center;gap:12px;min-height:44px;cursor:pointer}
.mbx-sw span{display:block;width:52px;height:26px;box-shadow:inset 0 0 0 1px #4a558c;background:var(--stone);position:relative;flex:none;transform:skewX(-14deg)}
.mbx-sw span::after{content:"";position:absolute;top:4px;left:4px;width:20px;height:18px;background:var(--ash);transition:transform .12s}
.mbx-sw input:checked+span{box-shadow:inset 0 0 0 1px var(--power-hi);background:rgba(139,77,255,.4)}
.mbx-sw input:checked+span::after{transform:translateX(24px);background:var(--power2);box-shadow:0 0 8px rgba(196,244,255,.7)}

.mbx-panel textarea{font:14px/1.35 ui-monospace,Menlo,Consolas,monospace;color:var(--bone);background:rgba(16,20,42,.9);border:1px solid #4a558c;padding:8px 10px;width:100%;box-sizing:border-box;min-height:92px;resize:none;border-radius:0;word-break:break-all;user-select:text;-webkit-user-select:text}

.mbx-msg{min-height:1.4em;font-size:.92rem;color:var(--ash);text-align:center}
.mbx-panel .mbx-msg.bad{color:var(--warn)}.mbx-panel .mbx-msg.good{color:var(--power2)}
.mbx-wide{max-width:780px}
.mbx-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
.mbx-tiles div{--c:8px;--f:rgba(17,22,46,.9);padding:8px 12px 7px;min-width:0}
.mbx-tiles b{display:block;font-family:var(--display);font-weight:700;font-size:1.8rem;line-height:1.05;letter-spacing:.03em;font-variant-numeric:tabular-nums;color:var(--bone)}

.mbx-rec ol li span:last-child{font-family:var(--display);font-weight:600;font-size:1rem;color:var(--gold);font-variant-numeric:tabular-nums;white-space:nowrap}
.mbx-story{max-width:580px;text-align:center;gap:16px;padding:30px 34px;cursor:pointer;animation:mbIn .45s ease-out both}
.mbx-story .tale{font-size:1.14rem;line-height:1.6;color:var(--bone)}

#mbHint{grid-area:1/1;position:relative;z-index:2;align-self:start;justify-self:center;margin:12px 12px 0;max-width:min(440px,calc(100% - 24px));box-sizing:border-box;pointer-events:none;
  background:linear-gradient(90deg,rgba(28,20,64,.95),rgba(9,11,24,.93));box-shadow:inset 4px 0 0 var(--power2);clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%);
  padding:7px 28px 8px 16px;font-size:.95rem;line-height:1.35;text-align:left;color:var(--bone);opacity:0;transform:translateX(-14px);transition:opacity .3s,transform .3s}

/* a screen is up: the hint would sit on top of it */
.stage:has(#ov:not([hidden])) #mbHint.on{opacity:0}
#mbHint b{display:block;font-family:var(--display);font-weight:700;font-size:.76rem;letter-spacing:.2em;text-transform:uppercase;color:var(--power2)}
.panel .mbx-note{color:var(--ash);font-size:.9rem;border-top:1px solid var(--line);padding-top:9px;align-self:stretch;font-variant-numeric:tabular-nums}

@media (prefers-reduced-motion:reduce){.panel,.mbx-panel,.mbx-story{animation:none}#mbHint{transition:none;transform:none}.mbx-sw span::after{transition:none}}
@media (max-width:480px){
  .vitals>div:last-child{width:100%}#bossBar{flex:1;width:auto;min-width:60px}

  #mbx{padding:8px}.mbx-panel{padding:16px 12px}.mbx-story{padding:22px 16px}.mbx-row{grid-template-columns:104px minmax(0,1fr);gap:8px}.mbx-row .val{min-width:2.6em}
  #mbHint{margin:6px 6px 0;padding:5px 22px 6px 12px;font-size:.82rem;max-width:calc(100% - 12px)}
}

  #mbx,#mbx.mbx-veil{padding:8px;width:100%;height:100%;background:var(--ink)}

  #mbHint{margin-top:64px;font-size:.85rem;max-width:min(360px,calc(100% - 24px))}
}
/* ---- net.js: the multiplayer lobby layer (#mbn) over the arena. It reuses .mbx-panel, .kick, .btns, .lab and .mbx-msg; the rest is here.
   .mbn-row = name field beside the mode chips, .mbn-list/.mbn-li = rooms and players, .mbn-how = join code and address, .mbn-cols = those two side by side ---- */
#mbn{grid-area:1/1;position:relative;z-index:3;display:grid;place-items:center;padding:16px;box-sizing:border-box;min-width:0;min-height:0;overflow:auto;
  background:radial-gradient(90% 70% at 50% 0,rgba(139,77,255,.14),transparent 70%),var(--ink)}
.mbn-panel{max-width:720px;gap:12px}
.mbn-head{display:flex;flex-direction:column;align-items:center;gap:10px}
.mbn-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:10px 20px;align-items:end}
.mbn-field{display:flex;flex-direction:column;gap:4px;min-width:0}
.mbn-panel input[type=text]{font:600 1.15rem/1.2 var(--display);letter-spacing:.06em;color:var(--bone);background:rgba(16,20,42,.9);border:1px solid #4a558c;border-radius:0;padding:9px 12px;min-height:44px;width:100%;box-sizing:border-box;
  user-select:text;-webkit-user-select:text;-webkit-appearance:none;appearance:none}
.mbn-panel input[type=text]::placeholder{color:var(--ash);opacity:.55;letter-spacing:.04em;font-weight:500}
.mbn-panel input[type=text]:focus-visible{outline:2px solid var(--power2);outline-offset:1px}
.mbn-modes{display:flex;gap:6px;min-width:0}
.mbn-mode{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:44px;box-sizing:border-box;padding:3px 8px;font-family:var(--display);font-weight:600;font-size:.95rem;line-height:1.1;letter-spacing:.09em;text-transform:uppercase;
  box-shadow:inset 0 0 0 1px #4a558c;color:var(--text);clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
.mbn-mode.on{box-shadow:inset 0 0 0 1px #c3aaff;background:linear-gradient(100deg,#5f2bd6,#8b4dff 55%,#a273ff);color:#fff;font-weight:700}
.mbn-mode.off{opacity:.5}
.mbn-mode small{font-size:.62rem;letter-spacing:.14em;color:var(--ash)}
.mbn-sub{margin:2px 0 -6px;color:var(--power2)}
.mbn-list{display:flex;flex-direction:column;gap:5px;min-width:0;max-height:min(40vh,300px);overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain}
.mbn-list>.dim{padding:6px 2px}
.mbn-li{display:flex;align-items:center;gap:6px 12px;min-height:44px;box-sizing:border-box;padding:4px 6px 4px 14px;background:rgba(17,22,46,.9);box-shadow:inset 3px 0 0 var(--line);min-width:0}
.mbn-li.me{box-shadow:inset 3px 0 0 var(--power)}
.mbn-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--display);font-weight:600;font-size:1.12rem;letter-spacing:.04em;color:var(--bone)}
.mbn-tag{white-space:nowrap;padding-right:8px}
.mbn-tag.ok{color:var(--pet-necro)}.mbn-tag.host{color:var(--gold)}
.mbn-li button{--c:6px;min-height:36px;padding:4px 14px;font-size:.84rem;flex:none}
.mbn-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(250px,100%),1fr));gap:12px 22px;align-items:start}
.mbn-how{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0;padding:8px 14px 10px;background:rgba(17,22,46,.9);box-shadow:inset 3px 0 0 var(--power2)}
.mbn-code{font-family:var(--display);font-weight:700;font-size:2.5rem;line-height:1.05;letter-spacing:.16em;color:var(--power2);font-variant-numeric:tabular-nums;user-select:text;-webkit-user-select:text;margin-bottom:4px;overflow-wrap:anywhere}
.mbn-code.long{font-size:1.75rem;letter-spacing:.1em;white-space:nowrap}
.mbn-url{font-family:var(--display);font-weight:600;font-size:1.12rem;letter-spacing:.04em;color:var(--bone);user-select:text;-webkit-user-select:text;overflow-wrap:anywhere}
.mbn-alt{font-size:.8rem!important;overflow-wrap:anywhere;margin-top:4px}
.stage:has(#mbn:not([hidden])) #mbHint.on{opacity:0}
@media (pointer:coarse){.mbn-li button{min-height:44px}}
@media (max-width:480px){#mbn{padding:8px}.mbn-code{font-size:2rem}.mbn-code.long{font-size:1.3rem;letter-spacing:.06em}}
@media (orientation:landscape) and (pointer:coarse) and (max-height:600px){
  #mbn{padding:8px;width:100%;height:100%}
  .stage:has(#mbn:not([hidden]))~.touch,.stage:has(#mbn:not([hidden]))~.vitals{visibility:hidden}
  .mbn-panel{max-width:760px;gap:6px}.mbn-head{flex-direction:row;justify-content:center;gap:14px}.mbn-head h2::after{display:none}
  .mbn-list{max-height:max(96px,calc(100vh - 215px))}.mbn-li{min-height:40px}
  .mbn-code{font-size:1.9rem}.mbn-code.long{font-size:1.6rem}.mbn-how{padding:5px 12px 6px}.mbn-members .mbn-li{min-height:34px}.mbn-url{font-size:1rem}
  .mbn-panel .mbx-msg{min-height:1.2em;font-size:.86rem}
}
/* ---- tower.js: the map of the climb (#mbt, a layer like #mbn), the seasoned-climb steps, the glimpse between floors (.mbt-peek) and the trial HUD (.trialHud).
   Colours: --trial = ember, for trial floors and their HUD; --bh / --bf = a band's own colour and wash, set inline from MB.tower.bands; --k = a floor kind's colour.
   .mbt-tiles = the four figures, .mbt-cols = tower beside next floors, .mbt-col = the scrolling tower, .mbt-band = one band (.here .done .far), .mbt-rail = how much of it is climbed,
   .mbt-cp = a checkpoint (.open / .shut; a button when a climb can start there), .mbt-strip/.mbt-fl = the next ten floors, .mbt-about = the line about the chosen one ---- */
#mbt{grid-area:1/1;position:relative;z-index:3;display:grid;place-items:center;padding:16px;box-sizing:border-box;min-width:0;min-height:0;overflow:auto;
  background:radial-gradient(90% 70% at 50% 0,rgba(139,77,255,.14),transparent 70%),var(--ink)}
.mbt-panel{max-width:800px;gap:10px}
.mbt-head{display:flex;flex-direction:column;align-items:center;gap:8px}
.mbt-ic{display:inline-grid;place-items:center;width:24px;height:24px;flex:none;color:var(--k,var(--power-hi))}
.mbt-ic svg{display:block;width:100%;height:100%}
.k-root{--k:var(--flesh)}.k-fight{--k:var(--power-hi)}.k-survive,.k-guard,.k-race,.k-ordeal,.k-cross{--k:var(--trial)}.k-guardian{--k:var(--foe)}
.mbt-tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
.mbt-tiles b{font-size:1.6rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbt-tiles small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbt-tiles .mbt-t-now b{color:var(--power2)}.mbt-tiles .mbt-t-best b{color:var(--gold)}
.mbt-tiles .mbt-t-band b{font-size:1.15rem;line-height:1.48;text-transform:uppercase}
.mbt-cols{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);gap:12px 20px;align-items:start}
.mbt-cols>section{min-width:0;display:flex;flex-direction:column;gap:6px}
.mbt-h{font-family:var(--display);font-size:.76rem;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--power2);margin:0;padding-left:10px;box-shadow:inset 3px 0 0 var(--power)}
.mbt-col{display:flex;flex-direction:column;gap:4px;max-height:344px;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;padding:2px 4px 2px 0;outline:0}
.mbt-col:focus-visible{box-shadow:0 0 0 2px var(--power2)}
.mbt-band{--bh:var(--power-hi);--bf:rgba(139,77,255,.15);position:relative;flex:none;margin-inline:calc(var(--i,0)*5px);padding:6px 10px 7px 22px;min-width:0;
  background:linear-gradient(100deg,var(--bf),transparent 78%),rgba(17,22,46,.92);box-shadow:inset 0 0 0 1px var(--line);
  clip-path:polygon(0 0,calc(100% - 9px) 0,100% 9px,100% 100%,9px 100%,0 calc(100% - 9px))}
.mbt-band.here{box-shadow:inset 0 0 0 1px var(--bh),inset 0 0 22px var(--bf)}
.mbt-band.far{opacity:.72}
.mbt-rail{position:absolute;left:8px;top:8px;bottom:8px;width:5px;clip-path:polygon(0 3px,100% 0,100% calc(100% - 3px),0 100%);
  background:linear-gradient(to top,var(--power2) calc(var(--pc,0)*100%),transparent 0),linear-gradient(to top,var(--bh) calc(var(--pb,0)*100%),var(--stone-2) 0)}
.mbt-bhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:1px 10px}
.mbt-bn{font-family:var(--display);font-weight:700;font-size:1.1rem;line-height:1.15;letter-spacing:.05em;text-transform:uppercase;color:var(--bh);min-width:0;overflow-wrap:anywhere}
.mbt-br{font-size:.72rem;letter-spacing:.12em;white-space:nowrap}
.mbt-tags{display:flex;flex-wrap:wrap;gap:4px;margin-left:auto}
.mbt-tag{font-family:var(--display);font-weight:700;font-size:.72rem;line-height:1.35;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;padding:1px 9px;font-variant-numeric:tabular-nums;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}
.mbt-tag.you{background:var(--power2);color:var(--ink)}
.mbt-tag.best{background:rgba(240,184,72,.2);color:var(--gold)}
.mbt-cprow{display:flex;align-items:center;gap:4px 10px;margin-top:4px;min-width:0}
.mbt-cprow>.lab{font-size:.66rem;letter-spacing:.12em;flex:none}
.mbt-cps{display:flex;flex-wrap:wrap;gap:5px;min-width:0}
.mbt-cp,.mbt-cols button.mbt-cp{box-sizing:border-box;display:inline-grid;place-items:center;min-width:42px;height:26px;min-height:0;padding:0 11px;font-family:var(--display);font-weight:700;font-size:.92rem;line-height:1;letter-spacing:.04em;font-variant-numeric:tabular-nums;
  clip-path:polygon(9px 0,calc(100% - 9px) 0,100% 50%,calc(100% - 9px) 100%,9px 100%,0 50%);box-shadow:none;background:var(--stone-2);color:var(--ash)}
.mbt-cp.shut{opacity:.5;background:repeating-linear-gradient(-60deg,var(--stone-2) 0 3px,rgba(39,46,77,.35) 3px 6px)}
.mbt-cp.open{background:rgba(240,184,72,.24);color:var(--gold)}
.mbt-cols button.mbt-cp.open{height:32px;min-width:50px;background:linear-gradient(100deg,#5f2bd6,#8b4dff 55%,#a273ff);color:#fff}
.mbt-cols button.mbt-cp:focus-visible{background:var(--power2);color:var(--ink);box-shadow:none}
.mbt-strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.mbt-strip button.mbt-fl{--c:7px;--e:var(--line);--f:rgba(17,22,46,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:0;min-height:62px;padding:5px 1px 4px;letter-spacing:0;text-transform:none}
.mbt-fl b{font-family:var(--display);font-weight:700;font-size:1.05rem;line-height:1;font-variant-numeric:tabular-nums;color:var(--bone)}
.mbt-fl small{font-family:var(--display);font-weight:600;font-size:.6rem;line-height:1.1;letter-spacing:.06em;text-transform:uppercase;color:var(--ash);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mbt-strip button.mbt-fl.k-guardian{--e:rgba(255,45,85,.6);--f:linear-gradient(160deg,rgba(255,45,85,.24),rgba(17,22,46,.94) 70%)}
.mbt-strip button.mbt-fl.k-survive,.mbt-strip button.mbt-fl.k-guard,.mbt-strip button.mbt-fl.k-race,.mbt-strip button.mbt-fl.k-ordeal,.mbt-strip button.mbt-fl.k-cross{--e:rgba(255,153,80,.45)}
.mbt-strip button.mbt-fl[aria-pressed="true"]{--e:var(--k);box-shadow:inset 0 0 0 2px var(--k);filter:brightness(1.15)}
.mbt-strip button.mbt-fl:focus-visible{box-shadow:inset 0 0 0 2px var(--power2),inset 0 0 14px rgba(196,244,255,.45)}
.mbx-panel .mbt-about{font-size:.9rem;line-height:1.4;min-height:4.2em;color:var(--text)}
.mbt-about b{display:block;font-family:var(--display);font-weight:700;font-size:.9rem;letter-spacing:.1em;text-transform:uppercase;color:var(--power2)}
.mbx-panel .mbt-note{font-size:.88rem;line-height:1.4;color:var(--ash);text-align:center}
.mbt-next .mbt-note{text-align:left;border-top:1px solid var(--stone-2);padding-top:8px}
.mbx-panel .mbt-co{text-align:left;color:var(--text);padding:7px 14px;background:rgba(17,22,46,.9);box-shadow:inset 3px 0 0 var(--power2)}
.mbt-co b,.mbt-warn b{font-family:var(--display);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.mbt-co b{color:var(--power2)}
.mbt-test{display:flex;justify-content:center}
/* the steps of a seasoned start */
.mbt-trail{display:flex;flex-wrap:wrap;justify-content:center;gap:5px}
.mbt-trail span{font-family:var(--display);font-weight:600;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--bone);padding:2px 12px;background:rgba(139,77,255,.3);clip-path:polygon(7px 0,100% 0,calc(100% - 7px) 100%,0 100%);font-variant-numeric:tabular-nums}
.mbt-trail.big span{font-size:1.05rem;padding:4px 16px}
.mbt-trail span:first-child{background:var(--power2);color:var(--ink);font-weight:700}
.mbt-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:7px;max-height:min(46vh,330px);overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;padding:2px 6px 2px 0}
.mbt-pick button.mbt-cpb{--c:8px;--e:var(--bh);--f:linear-gradient(110deg,var(--bf),rgba(17,22,46,.94) 75%);display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;min-width:0;min-height:50px;padding:6px 10px 6px 14px;letter-spacing:0;text-transform:none}
.mbt-cpb b{font-family:var(--display);font-weight:700;font-size:1.12rem;line-height:1.05;letter-spacing:.04em;text-transform:uppercase;font-variant-numeric:tabular-nums}
.mbt-cpb small{font-family:var(--display);font-weight:600;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--bh);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mbt-cards{max-height:min(52vh,380px);overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;padding:2px 6px 2px 0;box-sizing:border-box}
.mbt-cards.two{grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr))}
.mbt-cards button[aria-pressed="true"],.mbt-pick button[aria-pressed="true"]{--e:var(--power2);box-shadow:inset 0 0 0 2px var(--power2)}
.mbx-panel .mbt-warn{padding:9px 14px;background:rgba(255,45,85,.1);box-shadow:inset 3px 0 0 var(--foe);color:var(--text)}
.mbt-warn b{color:var(--warn)}
.mbt-kit{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(250px,100%),1fr));gap:0 22px;margin:0;font-size:.88rem}
.mbt-kit div{display:flex;gap:10px;align-items:baseline;padding:3px 0;border-bottom:1px solid var(--stone-2);min-width:0}
.mbt-kit dt{flex:0 0 86px;font-size:.72rem}.mbt-kit dd{margin:0;min-width:0;color:var(--text);overflow-wrap:anywhere}
.mbt-testing b{color:var(--gold);font-family:var(--display);letter-spacing:.06em;text-transform:uppercase}
.mbt-panel button.mbt-mini{--c:5px;min-height:30px;padding:2px 12px;font-size:.8rem;margin-left:6px;vertical-align:middle}
.mbt-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.stage:has(#mbt:not([hidden])) #mbHint.on{opacity:0}

/* ---- the apex tier. game.js builds the choice cards (.apexCard with .apexDominion or .apexOrder) and the ledger chip (.chipApex); tower.js reuses the cards in its start steps.
   Dominion: a dark ground under a jagged crown line. Order: a pale ground lit from above, under a broken ring. ---- */
.cards button.apexCard{--c:14px;padding:20px 15px 15px 20px;gap:6px;overflow:hidden}
.cards button.apexCard b{font-size:1.5rem;letter-spacing:.06em}
.cards button.apexCard::before{content:"";position:absolute;pointer-events:none}
.cards button.apexDominion{--e:var(--apex-dom);--f:radial-gradient(130% 90% at 50% 118%,rgba(120,40,190,.5),transparent 62%),linear-gradient(#150a26,#07040e)}
.cards button.apexDominion b{color:#ecdcff}
.cards button.apexDominion small{color:var(--apex-dom)}
.cards button.apexDominion::before{left:0;right:0;top:0;height:9px;background:var(--apex-dom);opacity:.85;
  clip-path:polygon(0 0,100% 0,100% 100%,94% 30%,88% 100%,82% 30%,76% 100%,70% 30%,64% 100%,58% 30%,52% 100%,46% 30%,40% 100%,34% 30%,28% 100%,22% 30%,16% 100%,10% 30%,4% 100%,0 30%)}
.cards button.apexOrder{--e:var(--apex-ord);--f:radial-gradient(120% 80% at 50% -22%,rgba(255,231,163,.4),transparent 64%),linear-gradient(#1b2036,#10142a)}
.cards button.apexOrder b{color:#fff8e2}
.cards button.apexOrder small{color:var(--apex-ord)}
.cards button.apexOrder::before{right:-26px;top:-26px;width:84px;height:84px;border-radius:50%;border:3px solid var(--apex-ord);border-left-color:transparent;border-bottom-color:rgba(159,232,255,.55);opacity:.6;transform:rotate(-18deg)}
.cards button.apexCard:hover,.cards button.apexCard:focus-visible{filter:brightness(1.2)}
.ledger li.chipApex,.chipApex{--e:var(--power2);--f:linear-gradient(100deg,rgba(139,77,255,.6),rgba(196,244,255,.24));color:#fff;opacity:1;font-weight:700}
.ledger li.chipApex.apexDominion,.chipApex.apexDominion{--e:var(--apex-dom);--f:linear-gradient(100deg,#07040e,#2c1150);color:#ecdcff}
.ledger li.chipApex.apexOrder,.chipApex.apexOrder{--e:var(--apex-ord);--f:linear-gradient(100deg,rgba(255,231,163,.34),rgba(159,232,255,.16));color:#fff8e2}

/* the two doors after a crossroads floor (#ovPanel.doorPanel, button.doorCard[data-door]): each card is a doorway, its arch drawn in the corner; trial reward screens (#ovPanel.trialPanel) take the ember accent */
.cards button.doorCard{--c:14px;--e:rgba(255,153,80,.7);--f:linear-gradient(180deg,rgba(255,153,80,.16),rgba(17,22,46,.94) 58%);padding:14px 58px 14px 18px;overflow:hidden}
.cards button.doorCard small{color:var(--trial)}
.cards button.doorCard::before{content:"";position:absolute;pointer-events:none;right:14px;top:14px;width:26px;height:40px;border:2px solid var(--trial);border-bottom:0;border-radius:14px 14px 0 0;opacity:.75;
  background:linear-gradient(var(--trial),var(--trial)) 50% 100%/2px 62% no-repeat}
.cards button.doorCard[data-door="wrath"]{--e:rgba(255,45,85,.75)}.cards button.doorCard[data-door="wrath"]::before{border-color:var(--foe)}
.cards button.doorCard:hover::before,.cards button.doorCard:focus-visible::before{opacity:1}
.panel.trialPanel .kick,.panel.doorPanel .kick{color:#ffd9b8;background:linear-gradient(90deg,rgba(255,153,80,.12),rgba(255,153,80,.4),rgba(255,153,80,.12))}
.panel.trialPanel h2::after,.panel.doorPanel h2::after{background:var(--trial)}
.panel.apexPanel h2::after{background:linear-gradient(90deg,var(--apex-dom),var(--apex-ord));width:120px}
/* ---- the trial HUD: a slanted band over the top edge of the arena (under the floating vitals on a phone held sideways). It never takes a touch.
   .k-<kind>, .s-start .s-clear .s-fail = the moment, .urgent = little time or little relic left, .done = the trial is over and only the outcome shows ---- */
.trialHud{--k:var(--trial);grid-area:1/1;position:relative;z-index:2;align-self:start;justify-self:center;margin:10px 10px 0;box-sizing:border-box;max-width:min(620px,calc(100% - 20px));pointer-events:none;
  display:flex;flex-wrap:wrap;align-items:center;gap:3px 14px;padding:6px 26px 7px 14px;color:var(--text);
  background:linear-gradient(90deg,rgba(46,24,10,.95),rgba(9,11,24,.93) 70%);box-shadow:inset 4px 0 0 var(--k);clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%)}
.th-ico{display:grid;flex:none}.th-ico .mbt-ic{width:28px;height:28px;color:var(--k)}
.th-text{display:flex;flex-direction:column;flex:1 1 210px;min-width:0}
.th-top{display:flex;align-items:baseline;gap:9px}
.th-kind{font-family:var(--display);font-weight:700;font-size:1.02rem;line-height:1.1;letter-spacing:.1em;text-transform:uppercase;color:var(--bone)}
.th-state{font-family:var(--display);font-weight:700;font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--k)}
.th-rule{font-size:.86rem;line-height:1.3;text-wrap:pretty}
.th-meters{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none}
.th-m{display:flex;align-items:center;gap:7px}
.th-m .lab{font-size:.66rem;letter-spacing:.14em}
.th-bar{display:block;width:92px;height:7px;background:var(--stone-2);transform:skewX(-24deg);flex:none}
.th-bar i{display:block;height:100%;width:0;background:var(--k)}
.th-m b{font-family:var(--display);font-weight:700;font-size:1.05rem;line-height:1;letter-spacing:.03em;color:var(--bone);font-variant-numeric:tabular-nums;min-width:2.7em;text-align:right;white-space:nowrap}
.th-cap{font-family:var(--display);font-weight:700;font-size:.74rem;line-height:1.4;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);background:var(--k);padding:1px 10px;white-space:nowrap;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}
.th-obj .th-bar i{background:var(--power2)}
.th-obj.low .th-bar i{background:var(--foe)}.th-obj.low b{color:var(--warn)}
.trialHud.urgent .th-time b{color:var(--warn)}
.trialHud.urgent .th-time .th-bar i{background:var(--foe)}
.trialHud.urgent{animation:mbUrgent .7s ease-in-out infinite}
.trialHud.s-start{animation:mbIn .25s ease-out both,mbTrial 1.2s .1s ease-out both}
.trialHud.s-clear{--k:var(--power2);background:linear-gradient(90deg,rgba(18,52,66,.95),rgba(9,11,24,.93) 70%)}
.trialHud.s-clear .th-state{color:var(--ink);background:var(--power2);padding:0 9px;clip-path:polygon(5px 0,100% 0,calc(100% - 5px) 100%,0 100%)}
.trialHud.s-fail{--k:var(--foe);background:linear-gradient(90deg,rgba(72,10,26,.95),rgba(9,11,24,.93) 70%)}
.trialHud.s-fail .th-state{color:#fff;background:var(--foe);padding:0 9px;clip-path:polygon(5px 0,100% 0,calc(100% - 5px) 100%,0 100%)}
.trialHud.done{animation:mbIn .2s ease-out both}
@keyframes mbTrial{0%{filter:brightness(2)}100%{filter:none}}
@keyframes mbUrgent{50%{box-shadow:inset 4px 0 0 var(--foe),inset 0 0 22px rgba(255,45,85,.5)}}
