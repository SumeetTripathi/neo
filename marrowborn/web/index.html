<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><style>body{margin:0}[hidden]{display:none!important}*{-webkit-tap-highlight-color:transparent}</style>
<title>Marrowborn</title>

<style>
@font-face{font-family: 'Pirata One'; font-style: normal; font-weight: 400; font-display: swap; src: url(fonts/f0.woff2) format('woff2');}
@font-face{font-family: 'Spectral'; font-style: italic; font-weight: 400; font-display: swap; src: url(fonts/f1.woff2) format('woff2');}
@font-face{font-family: 'Spectral'; font-style: normal; font-weight: 400; font-display: swap; src: url(fonts/f2.woff2) format('woff2');}
@font-face{font-family: 'Spectral'; font-style: normal; font-weight: 600; font-display: swap; src: url(fonts/f3.woff2) format('woff2');}
</style>
<style>
/* Layout: one crypt-dark column. Header (name + body-part ledger), the arena, a vitals row, touch controls. */
:root{
  color-scheme:dark;
  --ink:#0d0c11; --stone:#1a1822; --stone-2:#2a2636;
  --bone:#e7dfcd; --ash:#958ea3; --blood:#b8263d; --marrow:#d6a544; --flesh:#c68863;
  --display:"Pirata One","Luminari","Palatino Linotype",Georgia,serif;
  --body:"Spectral",Georgia,"Times New Roman",serif;
}
html,body{background:var(--ink);color:var(--bone);font-family:var(--body);font-size:16px;line-height:1.45}
.wrap{max-width:1000px;margin:0 auto;padding-block:16px 28px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:12px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 20px}
h1{font-family:var(--display);font-weight:400;font-size:2.1rem;line-height:1;margin:0;letter-spacing:.02em}
#lvl{color:var(--ash);font-style:italic;margin:0}
.ledger{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0}
.ledger li{font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;padding:3px 9px;border:1px solid var(--stone-2);color:var(--ash);opacity:.55}
.ledger li.on{color:var(--ink);background:var(--bone);border-color:var(--bone);opacity:1}
.stage{display:grid;border:1px solid var(--stone-2);background:#000}
canvas{grid-area:1/1;display:block;width:100%;max-width:100%;aspect-ratio:960/600;touch-action:none;align-self:start;cursor:crosshair}
#cv{position:relative;z-index:0}
#ov{grid-area:1/1;z-index:1;display:grid;place-items:center;padding:16px;background:rgba(13,12,17,.62)}
#ov.soft{background:rgba(13,12,17,.3);place-items:start center}
.panel{max-width:520px;min-width:0;text-align:center;background:rgba(13,12,17,.88);border:1px solid var(--stone-2);padding:20px 22px;display:flex;flex-direction:column;gap:10px;align-items:center}
.panel .kick{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--marrow);margin:0}
.panel h2{font-family:var(--display);font-weight:400;font-size:2.4rem;line-height:1;margin:0;text-wrap:balance}
.panel p{margin:0;text-wrap:pretty}
.panel .keys{color:var(--ash);font-size:.9rem}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:4px}
button{font:inherit;color:var(--bone);background:var(--stone);border:1px solid var(--ash);padding:8px 18px;cursor:pointer}
button.primary{background:var(--blood);border-color:var(--blood);font-weight:600}
button:hover{filter:brightness(1.15)}
button:focus-visible{outline:2px solid var(--marrow);outline-offset:2px}
button:disabled{opacity:.35;cursor:default}
.vitals{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;justify-content:space-between}
.vitals>div{display:flex;align-items:center;gap:10px;min-width:0}
.lab{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ash)}
#hp{display:flex;gap:4px;align-items:center}
#hp i{width:11px;height:15px;background:var(--blood);display:block}
#hp i.off{background:var(--stone-2)}
#hp em{color:var(--ash);font-size:.92rem}
#bossBar{width:min(260px,40vw);height:10px;background:var(--stone-2)}
#bossFill{height:100%;width:100%;background:var(--marrow)}
.tog{padding:3px 10px;font-size:.85rem}
.tog[aria-pressed="false"]{opacity:.45;text-decoration:line-through}
.panel.wide{max-width:760px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;width:100%}
.cards button{display:flex;flex-direction:column;gap:5px;text-align:left;align-items:flex-start;padding:10px 12px;min-width:0}
.cards b{font-family:var(--display);font-weight:400;font-size:1.6rem;line-height:1}
.cards small{color:var(--marrow);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase}
.cards span{font-size:.86rem;line-height:1.3}
.touch{display:none;justify-content:space-between;align-items:center;gap:16px;user-select:none;-webkit-user-select:none}
@media (pointer:coarse){.touch{display:flex}.kbd{display:none}}
#pad{width:120px;height:120px;border-radius:50%;border:1px solid var(--ash);background:var(--stone);position:relative;touch-action:none;flex:none}
#knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border-radius:50%;background:var(--bone);opacity:.85}
.touch .acts{display:flex;flex-wrap:wrap-reverse;justify-content:flex-end;gap:12px;max-width:180px}
.touch .acts button{width:84px;height:84px;border-radius:50%;touch-action:none}
.kbd{color:var(--ash);font-size:.9rem;margin:0}
kbd{font-family:inherit;border:1px solid var(--stone-2);padding:0 6px;color:var(--bone)}

/* phone held sideways: the arena fills the screen, controls float over its edges */
@media (orientation:landscape) and (pointer:coarse) and (max-height:600px){
  html,body{height:100%;overflow:hidden}
  .wrap{max-width:none;height:100%;padding:0;display:block}
  header,.ledger,.kbd{display:none}
  .stage{border:0;height:100%;justify-items:center;grid-template-rows:minmax(0,1fr);grid-template-columns:minmax(0,1fr)}
  canvas{width:auto;height:100%;max-width:100%;align-self:center}
  #ov{width:100%;height:100%;overflow:auto;padding:8px;box-sizing:border-box}
  #ov.soft{place-items:center}
  .panel{padding:12px 18px;gap:6px;max-width:600px}.panel h2{font-size:1.9rem}.panel p{font-size:.92rem;line-height:1.35}
  .vitals{position:fixed;z-index:2;top:max(6px,env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));pointer-events:none;font-size:.8rem;text-shadow:0 1px 2px #000}
  .vitals button{pointer-events:auto}#hp em{max-width:38vw;font-size:.72rem;line-height:1.2}#bossBar{width:22vw}
  .touch{position:fixed;z-index:2;bottom:max(14px,env(safe-area-inset-bottom,0px));left:max(18px,env(safe-area-inset-left,0px));right:max(18px,env(safe-area-inset-right,0px));pointer-events:none}
  #pad,.touch .acts{pointer-events:auto;opacity:.62}
  .touch{align-items:flex-end}.touch .acts{max-width:150px;gap:8px}.touch .acts button{width:68px;height:68px}
  .cards button{padding:7px 10px;gap:3px}.cards span{font-size:.8rem}.cards b{font-size:1.35rem}
}
</style>

<main class="wrap">
  <header>
    <h1>Marrowborn</h1>
    <p id="lvl">A crypt. A pile of bones.</p>
  </header>
  <ul class="ledger" id="ledger" aria-label="Body parts recovered"></ul>
  <div class="stage">
    <canvas id="gl" hidden aria-hidden="true"></canvas>
    <canvas id="cv" aria-label="Game arena"></canvas>
    <div id="ov"><div class="panel" id="ovPanel">
      <p class="kick" id="ovKick"></p>
      <h2 id="ovTitle"></h2>
      <p id="ovBody"></p>
      <p class="keys" id="ovKeys"></p>
      <div class="cards" id="ovCards"></div>
      <div class="btns" id="ovBtns"></div>
    </div></div>
  </div>
  <div class="vitals">
    <div><span class="lab">You</span><span id="hp"></span></div>
    <div><span class="lab" id="bossName">—</span><div id="bossBar"><div id="bossFill"></div></div>
      <button id="snd" class="tog" type="button" aria-pressed="true">Sound</button><button id="hap" class="tog" type="button" aria-pressed="true">Haptics</button></div>
  </div>
  <div class="touch">
    <div id="pad"><div id="knob"></div></div>
    <div class="acts"><button id="bDash" type="button">Dash</button><button id="bAtk" type="button" class="primary">Strike</button><button id="bSkill" type="button" hidden>Skill</button></div>
  </div>
  <p class="kbd"><kbd>WASD</kbd> or arrows to move · <kbd>Space</kbd> or click to strike · <kbd>Shift</kbd> to dash, once you have lungs · <kbd>E</kbd> for your class skill, once you earn it</p>
</main>

<script src="vendor/three.min.js"></script>
<script src="game.js"></script>
<script src="models-player.js"></script>
<script src="models-monsters.js"></script>
<script src="render3d.js"></script>


</html>
