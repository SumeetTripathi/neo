<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><style>body{margin:0}[hidden]{display:none!important}*{-webkit-tap-highlight-color:transparent}</style>
<title>Ashes to Apex</title>

<meta name="theme-color" content="#070912">
<!-- installable from a browser (Add to Home Screen on iOS, Install in Chrome and Edge); harmless inside the app -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="Ashes to Apex">
<meta name="format-detection" content="telephone=no">
<style>
/* Fonts: Rajdhani (display, labels, numbers) and Barlow (text). Both SIL Open Font License 1.1, latin subset, bundled for offline use. */
@font-face{font-family:'Rajdhani';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/rajdhani-500.woff2) format('woff2')}
@font-face{font-family:'Rajdhani';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/rajdhani-600.woff2) format('woff2')}
@font-face{font-family:'Rajdhani';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/rajdhani-700.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/barlow-400.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-600.woff2) format('woff2')}

/* ================= tokens =================
   Names used by game.js and extras.js (--ink --stone --stone-2 --bone --ash --blood --marrow --flesh --pet-necro --pet-beast --warn
   --display --body --mb-btn --cd --fill, and --mb-ui for the interface scale) are kept; only their values changed. Accents match MBStyle in render3d.js:
   power = electric violet (the player), power2 = cyan-white (highlights), foe = crimson (danger), gold = rarity and rank only. */
:root{
  color-scheme:dark;
  --ink:#070912; --stone:#10142a; --stone-2:#272e4d;
  --bone:#eeecfb; --ash:#989bbd; --blood:#f0355a; --marrow:#f0b848; --flesh:#c68863;
  --pet-necro:#7fd66b; --pet-beast:#8fd3ff; --warn:#ff8497;
  --power:#8b4dff; --power-hi:#b89cff; --power2:#c4f4ff; --foe:#ff2d55; --gold:#f0b848;
  --mana:#5cd9ff; --mana2:#8f6bff;
  --trial:#ff9950; --apex-dom:#c77dff; --apex-ord:#ffe7a3;
  --text:#d3d6ea; --line:#313a63; --plate:rgba(16,20,42,.92); --panel:rgba(9,11,24,.94);
  --r-common:#b9b2c6; --r-rare:#6ea3e0; --r-epic:#b88cff; --r-legendary:#f0b848;
  --display:"Rajdhani","Oswald","Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif;
  --body:"Barlow","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mb-btn:1;
  /* the interface scale. --ua follows the window (1 on phones, tablets and small laptops, growing with the shorter side: about 1.2 at 1080p, 1.6 at 1440p, 2.4 at 4K);
     --mb-ui is the player's own setting (MB.settings.ui, set on the root by extras.js and tower.js), held to what a small phone can fit (about 1.16 at 360 px).
     Every length in this sheet is a multiple of --u, and 1rem = 16 of them. */
  --ua:clamp(1px,calc(100vmin/900),3px); --u:min(calc(var(--ua)*var(--mb-ui,1)),calc(100vmin/310));
}
*{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
html{background:#000;-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation;height:100%;font-size:calc(var(--u)*16)}
body{background:#000;color:var(--bone);font-family:var(--body);font-size:1rem;line-height:1.45;height:100%;overflow:hidden}
/* ---- layout: the arena fills the window at every size and the interface floats over its edges, so the middle stays clear.
   Top left: health, mana, pets, then the trial. Top middle: wordmark and floor line, boss bar (on roomy screens). Top right: toggles, then the ledger chips.
   Bottom: stick and buttons (touch), or the skill bar (keyboard). Screens (#ov and the layers #mbx #mbn #mbt) cover the arena and scroll inside.
   --st --sb --sl --sr = distance kept from each screen edge (safe areas included), --togw = room kept for the toggles, --foot = what the bottom middle must clear,
   --hud0 = fallback for where the top HUD ends (tower.js measures it into --hud-top, --hud-mid and --hud-top2 on .stage). ---- */
.wrap{position:fixed;inset:0;display:block;
  --st:max(calc(var(--u)*8),env(safe-area-inset-top,0px));--sb:max(calc(var(--u)*12),env(safe-area-inset-bottom,0px));--sl:max(calc(var(--u)*12),env(safe-area-inset-left,0px));--sr:max(calc(var(--u)*12),env(safe-area-inset-right,0px));
  --togw:calc(var(--u)*214);--foot:calc(var(--sb) + calc(var(--u)*58));--hud0:calc(var(--u)*64)}
@media (pointer:coarse){.wrap{--foot:var(--sb)}}
@media (pointer:coarse) and (max-width:600px){.wrap{--foot:calc(var(--sb) + calc(var(--u)*208));--hud0:calc(var(--u)*150)}}

/* ---- shape language: plates with two cut corners (top left, bottom right), drawn without borders so the cut edge gets a line too.
   --c cut size, --e edge colour, --f fill. Slanted bands (kick, level line, bars) and bracket corners (panels, arena) complete it. ---- */
button,.ledger li,.mbx-seg span,.mbx-tiles div,.panel,.mbx-panel{
  --c:calc(var(--u)*7);--e:var(--line);--f:var(--plate);border:0;border-radius:0;
  clip-path:polygon(var(--c) 0,100% 0,100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,0 100%,0 var(--c));
  box-shadow:inset 0 0 0 1px var(--e);
  background:linear-gradient(135deg,var(--e) calc(var(--c)*.7071 + 1px),transparent 0),linear-gradient(315deg,var(--e) calc(var(--c)*.7071 + 1px),transparent 0),var(--f)}

/* ---- header: the wordmark and the floor line, top middle, on screens with room for them ---- */
header{position:fixed;z-index:2;top:var(--st);left:0;right:0;margin-inline:auto;width:fit-content;max-width:34vw;display:none;flex-wrap:nowrap;align-items:center;gap:calc(var(--u)*6) calc(var(--u)*14);pointer-events:none;text-shadow:0 1px calc(var(--u)*2) #000,0 0 calc(var(--u)*6) #000}
h1{font-family:var(--display);font-weight:700;font-size:1.15rem;line-height:1;margin:0;letter-spacing:.16em;text-transform:uppercase;display:none;align-items:center;gap:calc(var(--u)*8);white-space:nowrap;flex:none}
h1::before{content:"";width:calc(var(--u)*7);height:.82em;background:linear-gradient(var(--power2),var(--power));transform:skewX(-18deg);flex:none}
#lvl{font-family:var(--display);font-weight:500;font-size:.86rem;line-height:1.5;letter-spacing:.12em;text-transform:uppercase;color:var(--text);margin:0;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;
  padding:1px calc(var(--u)*14) 1px calc(var(--u)*22);background:linear-gradient(90deg,rgba(9,11,24,.6),rgba(70,38,150,.78));clip-path:polygon(calc(var(--u)*12) 0,100% 0,100% 100%,0 100%);box-shadow:inset calc(var(--u)*-2) 0 0 var(--power)}

/* ---- ledger chips, top right under the toggles: body parts, then rank, class, powers, boons, pets; equipment chips carry their rarity colour inline ---- */
.ledger{position:fixed;z-index:2;top:calc(var(--st) + calc(var(--u)*46));right:var(--sr);max-width:26vw;display:none;flex-wrap:wrap;justify-content:flex-end;gap:calc(var(--u)*5);list-style:none;margin:0;padding:0;pointer-events:none}
.ledger li{--c:calc(var(--u)*5);--f:rgba(9,11,24,.5);font-family:var(--display);font-weight:600;font-size:.72rem;line-height:1.3;letter-spacing:.12em;text-transform:uppercase;padding:calc(var(--u)*2) calc(var(--u)*9);color:var(--ash);opacity:.7;font-variant-numeric:tabular-nums}
.ledger li.on{--e:rgba(184,156,255,.75);--f:linear-gradient(100deg,rgba(100,52,200,.78),rgba(40,26,92,.72));color:#f4f0ff;opacity:1}
.ledger li[style]{--e:currentColor;--f:rgba(16,20,42,.8)}
.ledger:has(li[style]) li.on:first-child{--e:var(--gold);--f:linear-gradient(100deg,rgba(92,66,16,.85),rgba(40,30,12,.8));color:var(--gold)}

/* ---- the arena: both canvases take the whole window. The 3D view and its overlay follow whatever box they are given;
   without WebGL game.js draws its 960 by 600 arena centred inside the same box. ---- */
.stage{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr);justify-items:center;background:#000}
canvas{grid-area:1/1;display:block;width:100%;height:100%;min-width:0;min-height:0;touch-action:none;cursor:crosshair}
#cv{position:relative;z-index:0}

/* ---- overlay and its panel (title, reward, drop, pet, loadout, pause, death) ---- */
#ov{grid-area:1/1;z-index:1;display:grid;place-items:start center;width:100%;height:100%;box-sizing:border-box;overflow:auto;
  padding:calc(var(--u)*16) max(calc(var(--u)*16),env(safe-area-inset-right,0px)) max(calc(var(--u)*16),env(safe-area-inset-bottom,0px)) max(calc(var(--u)*16),env(safe-area-inset-left,0px));background:linear-gradient(rgba(7,9,18,.5),rgba(7,9,18,.74))}
#ov.soft{background:rgba(7,9,18,.3)}
/* a panel sits in the middle; one that is taller than the window scrolls inside itself (auto margins, so its top can never be cut off) */
#ov .panel,#mbx .mbx-panel,#mbn .mbx-panel,#mbt .mbx-panel{margin-block:auto}
#ov.soft .panel{margin-block:0 auto}
.panel,.mbx-panel{--c:calc(var(--u)*18);--e:var(--line);--sweep:rgba(196,244,255,.13);position:relative;
  background:
    linear-gradient(105deg,transparent 42%,var(--sweep) 50%,transparent 58%) 200% 0/250% 100% no-repeat,
    linear-gradient(135deg,var(--power) calc(var(--c)*.7071 + calc(var(--u)*2)),transparent 0),linear-gradient(315deg,var(--power) calc(var(--c)*.7071 + calc(var(--u)*2)),transparent 0),
    linear-gradient(var(--power2),var(--power2)) 100% 0/calc(var(--u)*30) calc(var(--u)*2) no-repeat,linear-gradient(var(--power2),var(--power2)) 100% 0/calc(var(--u)*2) calc(var(--u)*30) no-repeat,
    linear-gradient(var(--power2),var(--power2)) 0 100%/calc(var(--u)*30) calc(var(--u)*2) no-repeat,linear-gradient(var(--power2),var(--power2)) 0 100%/calc(var(--u)*2) calc(var(--u)*30) no-repeat,
    radial-gradient(120% calc(var(--u)*90) at 50% 0,rgba(139,77,255,.2),transparent 70%),
    repeating-linear-gradient(0deg,rgba(255,255,255,.016) 0 1px,transparent 1px calc(var(--u)*3)),
    var(--panel)}
.panel{max-width:calc(var(--u)*520);min-width:0;max-height:100%;overflow-x:hidden;overflow-y:auto;box-sizing:border-box;text-align:center;padding:calc(var(--u)*22) calc(var(--u)*26);display:flex;flex-direction:column;gap:calc(var(--u)*10);align-items:center;
  animation:mbIn .2s ease-out both,mbSweep .7s .08s ease-out both}
.panel>*{flex-shrink:0}
.panel.wide{max-width:calc(var(--u)*780)}
/* extras.js marks the first screen after a kill (mbx-clear) and a rank-up (mbx-rankup): one more accent sweep, gold for a new rank */
.panel.mbx-clear{animation-name:mbIn,mbSweepB}
.panel.mbx-rankup{--sweep:rgba(240,184,72,.3);animation-name:mbIn,mbSweepC;animation-duration:.2s,1.1s}
.panel.mbx-rankup #ovKeys{color:var(--gold);font-family:var(--display);font-weight:600;font-size:1rem;letter-spacing:.08em;text-transform:uppercase}
@keyframes mbIn{from{opacity:0;transform:translateY(calc(var(--u)*10)) scale(.985)}to{opacity:1;transform:none}}
@keyframes mbSweep{from{background-position:200% 0,0 0,0 0,100% 0,100% 0,0 100%,0 100%,0 0,0 0,0 0}to{background-position:-100% 0,0 0,0 0,100% 0,100% 0,0 100%,0 100%,0 0,0 0,0 0}}
@keyframes mbSweepB{from{background-position:200% 0,0 0,0 0,100% 0,100% 0,0 100%,0 100%,0 0,0 0,0 0}to{background-position:-100% 0,0 0,0 0,100% 0,100% 0,0 100%,0 100%,0 0,0 0,0 0}}
@keyframes mbSweepC{from{background-position:200% 0,0 0,0 0,100% 0,100% 0,0 100%,0 100%,0 0,0 0,0 0}to{background-position:-100% 0,0 0,0 0,100% 0,100% 0,0 100%,0 100%,0 0,0 0,0 0}}
.kick{font-family:var(--display);font-weight:600;font-size:.84rem;line-height:1.25;letter-spacing:.16em;text-transform:uppercase;color:var(--power2);margin:0;font-variant-numeric:tabular-nums;
  padding:calc(var(--u)*4) calc(var(--u)*20);background:linear-gradient(90deg,rgba(139,77,255,.14),rgba(139,77,255,.42),rgba(139,77,255,.14));clip-path:polygon(calc(var(--u)*10) 0,100% 0,calc(100% - calc(var(--u)*10)) 100%,0 100%);max-width:100%;box-sizing:border-box}
.kick:empty{display:none}
.panel h2,.mbx-panel h2{font-family:var(--display);font-weight:700;font-size:2.3rem;line-height:1;margin:calc(var(--u)*2) 0 0;letter-spacing:.04em;text-transform:uppercase;text-wrap:balance;max-width:100%;overflow-wrap:anywhere}
.panel h2::after,.mbx-panel h2::after{content:"";display:block;width:calc(var(--u)*64);height:calc(var(--u)*3);margin:calc(var(--u)*10) auto calc(var(--u)*2);background:var(--power);transform:skewX(-30deg)}
.panel h2[style*="color"]::after{background:currentColor}
.panel p{margin:0;text-wrap:pretty;color:var(--text)}
.panel .keys{color:var(--ash);font-size:.9rem}
.btns{display:flex;flex-wrap:wrap;gap:calc(var(--u)*10);justify-content:center;margin-top:calc(var(--u)*6)}

/* ---- buttons ---- */
button{font-family:var(--display);font-weight:600;font-size:1rem;line-height:1.15;letter-spacing:.09em;text-transform:uppercase;color:var(--bone);padding:calc(var(--u)*9) calc(var(--u)*20);min-height:calc(var(--u)*40);cursor:pointer;--e:#4a558c}
button.primary{--e:#c3aaff;--f:linear-gradient(100deg,#5f2bd6,#8b4dff 55%,#a273ff);color:#fff;font-weight:700}
button:hover:not(:disabled){--e:var(--power2);filter:brightness(1.14)}
button:active:not(:disabled){filter:brightness(1.3)}
button:focus-visible{outline:0;--e:var(--power2);box-shadow:inset 0 0 0 calc(var(--u)*2) var(--power2),inset 0 0 calc(var(--u)*16) rgba(196,244,255,.45)}
button:disabled{opacity:.35;cursor:default}
@media (pointer:coarse){button{min-height:max(44px,calc(var(--u)*44))}}

/* ---- choice cards. The <small> line carries the colour the game gives it (rarity, pet kind, "not carried" grey): its pseudo-elements paint the card's accent bar and wash in that colour ---- */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(calc(var(--u)*166),1fr));gap:calc(var(--u)*10);width:100%}
.cards button{--c:calc(var(--u)*11);--f:rgba(17,22,46,.94);position:relative;display:flex;flex-direction:column;gap:calc(var(--u)*5);text-align:left;align-items:flex-start;justify-content:flex-start;padding:calc(var(--u)*12) calc(var(--u)*13) calc(var(--u)*13) calc(var(--u)*18);min-width:0;
  font-family:var(--body);font-weight:400;font-size:1rem;letter-spacing:0;text-transform:none}
.cards b{font-family:var(--display);font-weight:700;font-size:1.3rem;line-height:1;letter-spacing:.03em;text-transform:uppercase;color:var(--bone);overflow-wrap:break-word;max-width:100%}
.cards small{font-family:var(--display);font-weight:600;font-size:.78rem;line-height:1.25;letter-spacing:.12em;text-transform:uppercase;color:var(--power-hi);font-variant-numeric:tabular-nums}
.cards small::before{content:"";position:absolute;left:0;top:0;bottom:0;width:calc(var(--u)*4);background:currentColor}
.cards small::after{content:"";position:absolute;inset:0;background:linear-gradient(125deg,currentColor,transparent 46%);opacity:.11;pointer-events:none}
.cards span{font-size:.88rem;line-height:1.36;color:var(--text)}
.cards button:hover small::after,.cards button:focus-visible small::after{opacity:.22}
/* a long list (the pets screen, .cards.list set by game.js): compact rows in columns that scroll inside the panel; the body text is cut to one line */
.cards.list{grid-template-columns:repeat(auto-fill,minmax(calc(var(--u)*232),1fr));gap:calc(var(--u)*6);max-height:min(44vh,calc(var(--u)*400));overflow-x:hidden;overflow-y:auto;padding:calc(var(--u)*2) calc(var(--u)*6) calc(var(--u)*2) 0;align-content:start;overscroll-behavior:contain}
.cards.list button{--c:calc(var(--u)*8);padding:calc(var(--u)*7) calc(var(--u)*10) calc(var(--u)*8) calc(var(--u)*15);gap:calc(var(--u)*2);min-height:calc(var(--u)*48)}
.cards.list b{font-size:1.04rem}.cards.list small{font-size:.72rem;letter-spacing:.09em}
.cards.list span{font-size:.78rem;line-height:1.25;color:var(--ash);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

/* ---- vitals: health pips, mana and pets top left; boss name and bar beside them (top middle on roomy screens); the toggles in the top right corner ---- */
.vitals{position:fixed;z-index:2;top:var(--st);left:var(--sl);right:var(--sr);display:flex;flex-wrap:wrap;gap:calc(var(--u)*4) calc(var(--u)*16);align-items:flex-start;justify-content:space-between;pointer-events:none;
  padding-right:var(--togw);text-shadow:0 1px calc(var(--u)*2) #000,0 0 calc(var(--u)*6) #000}
.vitals>div{display:flex;flex-wrap:wrap;align-items:center;gap:calc(var(--u)*5) calc(var(--u)*10);min-width:0;min-height:calc(var(--u)*24)}
.vitals>div:last-child{justify-content:flex-end}
.lab{font-family:var(--display);font-weight:600;font-size:.84rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ash);font-variant-numeric:tabular-nums}
#hp{display:flex;flex-wrap:wrap;gap:calc(var(--u)*4) calc(var(--u)*3);align-items:center;min-width:0;padding:0 calc(var(--u)*3)}
#hp.many{gap:calc(var(--u)*2) 1px}#hp.many i{width:calc(var(--u)*5)}#hp.lots i{width:calc(var(--u)*3)}
#hp i{width:calc(var(--u)*11);height:calc(var(--u)*15);background:linear-gradient(#ff5d7c,var(--blood) 55%,#b3123a);display:block;transform:skewX(-16deg)}
#hp i.off{background:rgba(39,46,77,.85)}
#hp em{color:var(--text);font-size:.8rem;line-height:1.2;font-style:normal;max-width:min(38vw,calc(var(--u)*400))}
#bossName{color:#ffb3c0}
#bossBar{width:min(calc(var(--u)*260),22vw);height:calc(var(--u)*10);background:rgba(39,46,77,.85);clip-path:polygon(calc(var(--u)*7) 0,100% 0,calc(100% - calc(var(--u)*7)) 100%,0 100%);flex:none}
#bossFill{height:100%;width:100%;background:linear-gradient(90deg,#a80f38,var(--foe))}
.togs{position:fixed;top:var(--st);right:var(--sr);display:flex;gap:calc(var(--u)*6);align-items:center}
.mb-left .vitals{padding-right:0;padding-left:var(--togw)}.mb-left .togs{right:auto;left:var(--sl)}
.tog{--c:calc(var(--u)*6);--f:rgba(9,11,24,.55);--e:rgba(74,85,140,.8);padding:calc(var(--u)*4) calc(var(--u)*10);font-size:.8rem;min-height:calc(var(--u)*32);min-width:calc(var(--u)*58);color:var(--text);text-shadow:none;pointer-events:auto}
.tog[aria-pressed="false"]{opacity:.45;text-decoration:line-through}
#pauseB[aria-pressed="true"]{--e:var(--power2);color:var(--power2)}
@media (pointer:coarse){.tog{min-height:max(44px,calc(var(--u)*44));min-width:max(44px,calc(var(--u)*58))}}

/* ---- mana: a slanted bar under the health pips. #manaFill = what you have (violet to cyan), #manaRes = the part held by pets or familiars (hatched, from the right),
   #manaNum = "84 / 120", #manaHeld = "32 held", #manaTag = "Drawing" while standing still pulls mana in. game.js sets .draw .full .low .held .deny on #mana. ---- */
.vitals>div:first-child{flex:1 1 calc(var(--u)*300)}
.vbrk{flex:0 0 100%;height:0;margin:0}
#mana{display:flex;align-items:center;gap:calc(var(--u)*4) calc(var(--u)*9);min-width:0;flex-wrap:wrap}
#mana .manaLab{color:var(--mana)}
#manaBar{position:relative;display:block;width:min(calc(var(--u)*210),24vw);height:calc(var(--u)*9);flex:none;background:rgba(39,46,77,.85);clip-path:polygon(calc(var(--u)*7) 0,100% 0,calc(100% - calc(var(--u)*7)) 100%,0 100%)}
#manaFill,#manaRes{position:absolute;top:0;bottom:0;display:block}
#manaFill{left:0;width:0;background:linear-gradient(90deg,var(--mana2),var(--mana) 85%,var(--power2))}
#manaRes{right:0;width:0;background:repeating-linear-gradient(-60deg,rgba(143,107,255,.6) 0 calc(var(--u)*3),rgba(12,15,32,.95) calc(var(--u)*3) calc(var(--u)*6))}
#manaNum{color:var(--mana);letter-spacing:.08em;white-space:nowrap}
#manaHeld{color:var(--power-hi);font-size:.74rem;letter-spacing:.1em;white-space:nowrap}#manaHeld:empty{display:none}
#manaTag{color:var(--power2);font-size:.72rem;letter-spacing:.18em;white-space:nowrap}#manaTag:empty{display:none}
#mana.draw #manaFill{animation:mbDraw .9s ease-in-out infinite}
#mana.draw #manaTag::before{content:"";display:inline-block;width:calc(var(--u)*7);height:calc(var(--u)*7);margin-right:calc(var(--u)*6);background:var(--mana);transform:rotate(45deg);animation:mbDraw .9s ease-in-out infinite}
#mana.low #manaNum{color:var(--warn)}

  display:flex;align-items:stretch;justify-content:center;gap:calc(var(--u)*5);font-family:var(--display);text-shadow:0 1px calc(var(--u)*2) #000;font-variant-numeric:tabular-nums}
#vsHud.vs-ffa{flex-direction:column;align-items:center;gap:calc(var(--u)*4);width:min(calc(var(--u)*520),calc(100% - var(--sl,12px) - var(--sr,12px)))}
.vsh-mid{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;min-width:calc(var(--u)*96);box-sizing:border-box;padding:calc(var(--u)*3) calc(var(--u)*20) calc(var(--u)*4);background:linear-gradient(180deg,rgba(28,20,64,.92),rgba(9,11,24,.86));
  clip-path:polygon(0 0,100% 0,calc(100% - calc(var(--u)*11)) 100%,calc(var(--u)*11) 100%);box-shadow:inset 0 calc(var(--u)*-2) 0 var(--power)}
.vsh-round{font-weight:600;font-size:.62rem;line-height:1.3;letter-spacing:.16em;text-transform:uppercase;color:var(--ash);white-space:nowrap}
.vsh-time{font-weight:700;font-size:1.7rem;line-height:1;letter-spacing:.04em;color:var(--bone);white-space:nowrap}
.vsh-note{font-weight:700;font-size:.6rem;line-height:1.3;letter-spacing:.18em;text-transform:uppercase;color:var(--power2);white-space:nowrap}.vsh-note:empty{display:none}
#vsHud.ph-count .vsh-time{color:var(--power2);font-size:1.9rem}
#vsHud.ph-sudden .vsh-time,#vsHud.ph-over .vsh-time{font-size:1.05rem;line-height:1.35;letter-spacing:.12em;text-transform:uppercase}
#vsHud.urgent .vsh-time,#vsHud.urgent .vsh-note{color:var(--warn)}
#vsHud.urgent .vsh-mid{box-shadow:inset 0 calc(var(--u)*-2) 0 var(--foe);background:linear-gradient(180deg,rgba(72,10,26,.94),rgba(9,11,24,.88));animation:vsUrgent .7s ease-in-out infinite}
@keyframes vsUrgent{50%{box-shadow:inset 0 calc(var(--u)*-2) 0 var(--foe),inset 0 0 calc(var(--u)*18) rgba(255,45,85,.55)}}
.vsh-side{--tc:var(--line);display:flex;flex-direction:column;justify-content:center;gap:calc(var(--u)*3);min-width:0;padding:calc(var(--u)*3) calc(var(--u)*16) calc(var(--u)*4) calc(var(--u)*11);background:rgba(9,11,24,.84);box-shadow:inset calc(var(--u)*3) 0 0 var(--tc);clip-path:polygon(0 0,100% 0,calc(100% - calc(var(--u)*11)) 100%,0 100%)}
.vsh-side.a{align-items:flex-end}
.vsh-side.b{align-items:flex-start;padding:calc(var(--u)*3) calc(var(--u)*11) calc(var(--u)*4) calc(var(--u)*16);box-shadow:inset calc(var(--u)*-3) 0 0 var(--tc);clip-path:polygon(0 0,100% 0,100% 100%,calc(var(--u)*11) 100%)}
@supports (background:color-mix(in srgb,red 10%,transparent)){
  .vsh-side.a{background:linear-gradient(90deg,color-mix(in srgb,var(--tc) 26%,transparent),transparent 85%),rgba(9,11,24,.84)}
  .vsh-side.b{background:linear-gradient(270deg,color-mix(in srgb,var(--tc) 26%,transparent),transparent 85%),rgba(9,11,24,.84)}}
.vsh-tn{font-weight:700;font-size:.74rem;line-height:1.15;letter-spacing:.12em;text-transform:uppercase;color:var(--tc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.vsh-pips,.vsh-men{display:flex;gap:calc(var(--u)*3);flex:none}
.vsh-pips i{display:block;width:calc(var(--u)*13);height:calc(var(--u)*7);background:rgba(39,46,77,.92);transform:skewX(-20deg)}
.vsh-pips i.on{background:var(--tc);box-shadow:0 0 calc(var(--u)*6) var(--tc)}
.vsh-men{gap:calc(var(--u)*4)}
.vsh-men i{display:block;width:calc(var(--u)*7);height:calc(var(--u)*7);border-radius:50%;background:var(--tc)}
.vsh-men i.me{box-shadow:0 0 0 1px var(--ink),0 0 0 calc(var(--u)*2) #fff}
.vsh-men i.down{background:rgba(9,11,24,.6);box-shadow:inset 0 0 0 1px var(--ash)}
.vsh-men i.me.down{box-shadow:inset 0 0 0 1px var(--ash),0 0 0 1px var(--ink),0 0 0 calc(var(--u)*2) var(--ash)}
.vsh-side.out{filter:saturate(.35) brightness(.8)}
.vsh-chips{display:flex;flex-wrap:wrap;justify-content:center;gap:calc(var(--u)*3) calc(var(--u)*4);width:100%}
.vsh-chip{--tc:var(--bone);display:flex;align-items:center;gap:calc(var(--u)*6);box-sizing:border-box;min-width:0;max-width:calc(25% - calc(var(--u)*3));padding:1px calc(var(--u)*8) 1px calc(var(--u)*8);background:rgba(9,11,24,.84);box-shadow:inset calc(var(--u)*3) 0 0 var(--tc);
  font-weight:600;font-size:.72rem;line-height:1.4;letter-spacing:.07em;text-transform:uppercase;color:var(--bone)}
#vsHud.n2 .vsh-chip,#vsHud.n3 .vsh-chip{max-width:calc(33% - calc(var(--u)*3))}
.vsh-nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vsh-n{flex:none;font-weight:700;font-size:.92rem;line-height:1;color:var(--tc)}
.vsh-chip.me{box-shadow:inset calc(var(--u)*3) 0 0 var(--tc),inset 0 0 0 1px rgba(255,255,255,.55)}
.vsh-chip.lead .vsh-n{color:var(--gold)}
.vsh-chip.down{background:rgba(9,11,24,.6)}.vsh-chip.down .vsh-nm{color:var(--ash);text-decoration:line-through}.vsh-chip.down .vsh-n{opacity:.6}
.stage:has(#ov:not([hidden]):not(.soft)) #vsHud,.stage:has(#mbx:not([hidden])) #vsHud,.stage:has(#mbn:not([hidden])) #vsHud,.stage:has(#mbt:not([hidden])) #vsHud{visibility:hidden}
/* a hint would sit on the score: it moves to the foot of the arena */
.stage:has(#vsHud:not([hidden])) #mbHint{align-self:end;margin-top:0;margin-bottom:var(--foot)}
/* wide screens: the strip takes the boss bar's place, straight under the floor line */
@media (min-width:1280px) and (min-height:560px){#vsHud{margin-top:calc(var(--st) + calc(var(--u)*30))}}
@media (max-height:600px),(max-width:600px){
  .vsh-mid{min-width:calc(var(--u)*84);padding:calc(var(--u)*2) calc(var(--u)*16) calc(var(--u)*3)}.vsh-time{font-size:1.4rem}#vsHud.ph-count .vsh-time{font-size:1.55rem}#vsHud.ph-sudden .vsh-time,#vsHud.ph-over .vsh-time{font-size:.92rem}
  .vsh-side{padding:calc(var(--u)*2) calc(var(--u)*14) calc(var(--u)*3) calc(var(--u)*9);gap:calc(var(--u)*2)}.vsh-side.b{padding:calc(var(--u)*2) calc(var(--u)*9) calc(var(--u)*3) calc(var(--u)*14)}.vsh-tn{font-size:.68rem}.vsh-pips i{width:calc(var(--u)*10);height:calc(var(--u)*6)}.vsh-men i{width:calc(var(--u)*6);height:calc(var(--u)*6)}
  .vsh-chip{font-size:.66rem;padding-inline:calc(var(--u)*7) calc(var(--u)*6);gap:calc(var(--u)*4)}.vsh-n{font-size:.84rem}
}
/* sideways on a phone the stick and the buttons own the lower corners: the strip keeps to the middle */
@media (orientation:landscape) and (pointer:coarse) and (max-height:600px){#vsHud{max-width:calc(100% - calc(var(--u)*300))}#vsHud.vs-ffa{width:min(calc(var(--u)*460),calc(100% - calc(var(--u)*300)))}}
@media (prefers-reduced-motion:reduce){#vsHud.urgent .vsh-mid{animation:none;box-shadow:inset 0 calc(var(--u)*-2) 0 var(--foe),inset 0 0 0 1px var(--foe)}}
/* ---- tower.js: the map of the climb (#mbt, a layer like #mbn), the seasoned-climb steps, the glimpse between floors (.mbt-peek) and the trial HUD (.trialHud).
   Colours: --trial = ember, for trial floors and their HUD; --bh / --bf = a band's own colour and wash, set inline from MB.tower.bands; --k = a floor kind's colour.
   .mbt-tiles = the four figures, .mbt-cols = tower beside next floors, .mbt-col = the scrolling tower, .mbt-band = one band (.here .done .far), .mbt-rail = how much of it is climbed,
   .mbt-cp = a checkpoint (.open / .shut; a button when a climb can start there), .mbt-strip/.mbt-fl = the next ten floors, .mbt-about = the line about the chosen one ---- */
#mbt{grid-area:1/1;position:relative;z-index:3;display:grid;place-items:start center;width:100%;height:100%;padding:calc(var(--u)*16);box-sizing:border-box;min-width:0;min-height:0;overflow:auto;
  background:radial-gradient(90% 70% at 50% 0,rgba(139,77,255,.14),transparent 70%),var(--ink)}
.mbt-panel{max-width:calc(var(--u)*800);gap:calc(var(--u)*10)}
.mbt-head{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*8)}
.mbt-ic{display:inline-grid;place-items:center;width:calc(var(--u)*24);height:calc(var(--u)*24);flex:none;color:var(--k,var(--power-hi))}
.mbt-ic svg{display:block;width:100%;height:100%}
.k-root{--k:var(--flesh)}.k-fight{--k:var(--power-hi)}.k-survive,.k-guard,.k-race,.k-ordeal,.k-cross{--k:var(--trial)}.k-guardian{--k:var(--foe)}
.mbt-tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
.mbt-tiles b{font-size:1.6rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbt-tiles small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbt-tiles .mbt-t-now b{color:var(--power2)}.mbt-tiles .mbt-t-best b{color:var(--gold)}
.mbt-tiles .mbt-t-band b{font-size:1.15rem;line-height:1.48;text-transform:uppercase}
.mbt-cols{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);gap:calc(var(--u)*12) calc(var(--u)*20);align-items:start}
.mbt-cols>section{min-width:0;display:flex;flex-direction:column;gap:calc(var(--u)*6)}
.mbt-h{font-family:var(--display);font-size:.76rem;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--power2);margin:0;padding-left:calc(var(--u)*10);box-shadow:inset calc(var(--u)*3) 0 0 var(--power)}
.mbt-col{display:flex;flex-direction:column;gap:calc(var(--u)*4);max-height:calc(var(--u)*344);overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;padding:calc(var(--u)*2) calc(var(--u)*4) calc(var(--u)*2) 0;outline:0}
.mbt-col:focus-visible{box-shadow:0 0 0 calc(var(--u)*2) var(--power2)}
.mbt-band{--bh:var(--power-hi);--bf:rgba(139,77,255,.15);position:relative;flex:none;margin-inline:calc(var(--i,0)*calc(var(--u)*5));padding:calc(var(--u)*6) calc(var(--u)*10) calc(var(--u)*7) calc(var(--u)*22);min-width:0;
  background:linear-gradient(100deg,var(--bf),transparent 78%),rgba(17,22,46,.92);box-shadow:inset 0 0 0 1px var(--line);
  clip-path:polygon(0 0,calc(100% - calc(var(--u)*9)) 0,100% calc(var(--u)*9),100% 100%,calc(var(--u)*9) 100%,0 calc(100% - calc(var(--u)*9)))}
.mbt-band.here{box-shadow:inset 0 0 0 1px var(--bh),inset 0 0 calc(var(--u)*22) var(--bf)}
.mbt-band.far{opacity:.72}
.mbt-rail{position:absolute;left:calc(var(--u)*8);top:calc(var(--u)*8);bottom:calc(var(--u)*8);width:calc(var(--u)*5);clip-path:polygon(0 calc(var(--u)*3),100% 0,100% calc(100% - calc(var(--u)*3)),0 100%);
  background:linear-gradient(to top,var(--power2) calc(var(--pc,0)*100%),transparent 0),linear-gradient(to top,var(--bh) calc(var(--pb,0)*100%),var(--stone-2) 0)}
.mbt-bhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:1px calc(var(--u)*10)}
.mbt-bn{font-family:var(--display);font-weight:700;font-size:1.1rem;line-height:1.15;letter-spacing:.05em;text-transform:uppercase;color:var(--bh);min-width:0;overflow-wrap:anywhere}
.mbt-br{font-size:.72rem;letter-spacing:.12em;white-space:nowrap}
.mbt-tags{display:flex;flex-wrap:wrap;gap:calc(var(--u)*4);margin-left:auto}
.mbt-tag{font-family:var(--display);font-weight:700;font-size:.72rem;line-height:1.35;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;padding:1px calc(var(--u)*9);font-variant-numeric:tabular-nums;clip-path:polygon(calc(var(--u)*6) 0,100% 0,calc(100% - calc(var(--u)*6)) 100%,0 100%)}
.mbt-tag.you{background:var(--power2);color:var(--ink)}
.mbt-tag.best{background:rgba(240,184,72,.2);color:var(--gold)}
.mbt-cprow{display:flex;align-items:center;gap:calc(var(--u)*4) calc(var(--u)*10);margin-top:calc(var(--u)*4);min-width:0}
.mbt-cprow>.lab{font-size:.66rem;letter-spacing:.12em;flex:none}
.mbt-cps{display:flex;flex-wrap:wrap;gap:calc(var(--u)*5);min-width:0}
.mbt-cp,.mbt-cols button.mbt-cp{box-sizing:border-box;display:inline-grid;place-items:center;min-width:calc(var(--u)*42);height:calc(var(--u)*26);min-height:0;padding:0 calc(var(--u)*11);font-family:var(--display);font-weight:700;font-size:.92rem;line-height:1;letter-spacing:.04em;font-variant-numeric:tabular-nums;
  clip-path:polygon(calc(var(--u)*9) 0,calc(100% - calc(var(--u)*9)) 0,100% 50%,calc(100% - calc(var(--u)*9)) 100%,calc(var(--u)*9) 100%,0 50%);box-shadow:none;background:var(--stone-2);color:var(--ash)}
.mbt-cp.shut{opacity:.5;background:repeating-linear-gradient(-60deg,var(--stone-2) 0 calc(var(--u)*3),rgba(39,46,77,.35) calc(var(--u)*3) calc(var(--u)*6))}
.mbt-cp.open{background:rgba(240,184,72,.24);color:var(--gold)}
.mbt-cols button.mbt-cp.open{height:calc(var(--u)*32);min-width:calc(var(--u)*50);background:linear-gradient(100deg,#5f2bd6,#8b4dff 55%,#a273ff);color:#fff}
.mbt-cols button.mbt-cp:focus-visible{background:var(--power2);color:var(--ink);box-shadow:none}
.mbt-strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:calc(var(--u)*5)}
.mbt-strip button.mbt-fl{--c:calc(var(--u)*7);--e:var(--line);--f:rgba(17,22,46,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:0;min-height:calc(var(--u)*62);padding:calc(var(--u)*5) 1px calc(var(--u)*4);letter-spacing:0;text-transform:none}
.mbt-fl b{font-family:var(--display);font-weight:700;font-size:1.05rem;line-height:1;font-variant-numeric:tabular-nums;color:var(--bone)}
.mbt-fl small{font-family:var(--display);font-weight:600;font-size:.6rem;line-height:1.1;letter-spacing:.06em;text-transform:uppercase;color:var(--ash);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mbt-strip button.mbt-fl.k-guardian{--e:rgba(255,45,85,.6);--f:linear-gradient(160deg,rgba(255,45,85,.24),rgba(17,22,46,.94) 70%)}
.mbt-strip button.mbt-fl.k-survive,.mbt-strip button.mbt-fl.k-guard,.mbt-strip button.mbt-fl.k-race,.mbt-strip button.mbt-fl.k-ordeal,.mbt-strip button.mbt-fl.k-cross{--e:rgba(255,153,80,.45)}
.mbt-strip button.mbt-fl[aria-pressed="true"]{--e:var(--k);box-shadow:inset 0 0 0 calc(var(--u)*2) var(--k);filter:brightness(1.15)}
.mbt-strip button.mbt-fl:focus-visible{box-shadow:inset 0 0 0 calc(var(--u)*2) var(--power2),inset 0 0 calc(var(--u)*14) rgba(196,244,255,.45)}
.mbx-panel .mbt-about{font-size:.9rem;line-height:1.4;min-height:4.2em;color:var(--text)}
.mbt-about b{display:block;font-family:var(--display);font-weight:700;font-size:.9rem;letter-spacing:.1em;text-transform:uppercase;color:var(--power2)}
.mbx-panel .mbt-note{font-size:.88rem;line-height:1.4;color:var(--ash);text-align:center}
.mbt-next .mbt-note{text-align:left;border-top:1px solid var(--stone-2);padding-top:calc(var(--u)*8)}
.mbx-panel .mbt-co{text-align:left;color:var(--text);padding:calc(var(--u)*7) calc(var(--u)*14);background:rgba(17,22,46,.9);box-shadow:inset calc(var(--u)*3) 0 0 var(--power2)}
.mbt-co b,.mbt-warn b{font-family:var(--display);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.mbt-co b{color:var(--power2)}
.mbt-test{display:flex;justify-content:center}
/* the steps of a seasoned start */
.mbt-trail{display:flex;flex-wrap:wrap;justify-content:center;gap:calc(var(--u)*5)}
.mbt-trail span{font-family:var(--display);font-weight:600;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--bone);padding:calc(var(--u)*2) calc(var(--u)*12);background:rgba(139,77,255,.3);clip-path:polygon(calc(var(--u)*7) 0,100% 0,calc(100% - calc(var(--u)*7)) 100%,0 100%);font-variant-numeric:tabular-nums}
.mbt-trail.big span{font-size:1.05rem;padding:calc(var(--u)*4) calc(var(--u)*16)}
.mbt-trail span:first-child{background:var(--power2);color:var(--ink);font-weight:700}
.mbt-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(var(--u)*132),1fr));gap:calc(var(--u)*7);max-height:min(46vh,calc(var(--u)*330));overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;padding:calc(var(--u)*2) calc(var(--u)*6) calc(var(--u)*2) 0}
.mbt-pick button.mbt-cpb{--c:calc(var(--u)*8);--e:var(--bh);--f:linear-gradient(110deg,var(--bf),rgba(17,22,46,.94) 75%);display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;min-width:0;min-height:calc(var(--u)*50);padding:calc(var(--u)*6) calc(var(--u)*10) calc(var(--u)*6) calc(var(--u)*14);letter-spacing:0;text-transform:none}
.mbt-cpb b{font-family:var(--display);font-weight:700;font-size:1.12rem;line-height:1.05;letter-spacing:.04em;text-transform:uppercase;font-variant-numeric:tabular-nums}
.mbt-cpb small{font-family:var(--display);font-weight:600;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--bh);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mbt-cards{max-height:min(52vh,calc(var(--u)*380));overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;padding:calc(var(--u)*2) calc(var(--u)*6) calc(var(--u)*2) 0;box-sizing:border-box}
.mbt-cards.two{grid-template-columns:repeat(auto-fit,minmax(min(calc(var(--u)*230),100%),1fr))}
.mbt-cards button[aria-pressed="true"],.mbt-pick button[aria-pressed="true"]{--e:var(--power2);box-shadow:inset 0 0 0 calc(var(--u)*2) var(--power2)}
.mbx-panel .mbt-warn{padding:calc(var(--u)*9) calc(var(--u)*14);background:rgba(255,45,85,.1);box-shadow:inset calc(var(--u)*3) 0 0 var(--foe);color:var(--text)}
.mbt-warn b{color:var(--warn)}
.mbt-kit{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(calc(var(--u)*250),100%),1fr));gap:0 calc(var(--u)*22);margin:0;font-size:.88rem}
.mbt-kit div{display:flex;gap:calc(var(--u)*10);align-items:baseline;padding:calc(var(--u)*3) 0;border-bottom:1px solid var(--stone-2);min-width:0}
.mbt-kit dt{flex:0 0 calc(var(--u)*86);font-size:.72rem}.mbt-kit dd{margin:0;min-width:0;color:var(--text);overflow-wrap:anywhere}
.mbt-testing b{color:var(--gold);font-family:var(--display);letter-spacing:.06em;text-transform:uppercase}
.mbt-panel button.mbt-mini{--c:calc(var(--u)*5);min-height:calc(var(--u)*30);padding:calc(var(--u)*2) calc(var(--u)*12);font-size:.8rem;margin-left:calc(var(--u)*6);vertical-align:middle}
.mbt-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.stage:has(#mbt:not([hidden])) #mbHint.on{opacity:0}

/* ---- the apex tier. game.js builds the choice cards (.apexCard with .apexDominion or .apexOrder) and the ledger chip (.chipApex); tower.js reuses the cards in its start steps.
   Dominion: a dark ground under a jagged crown line. Order: a pale ground lit from above, under a broken ring. ---- */
.cards button.apexCard{--c:calc(var(--u)*14);padding:calc(var(--u)*20) calc(var(--u)*15) calc(var(--u)*15) calc(var(--u)*20);gap:calc(var(--u)*6);overflow:hidden}
.cards button.apexCard b{font-size:1.5rem;letter-spacing:.06em}
.cards button.apexCard::before{content:"";position:absolute;pointer-events:none}
.cards button.apexDominion{--e:var(--apex-dom);--f:radial-gradient(130% 90% at 50% 118%,rgba(120,40,190,.5),transparent 62%),linear-gradient(#150a26,#07040e)}
.cards button.apexDominion b{color:#ecdcff}
.cards button.apexDominion small{color:var(--apex-dom)}
